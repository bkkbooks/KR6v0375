front:
  text: 譯者敘言一達喇那他為西藏覺昂派之大師曾旅行印度尼泊爾各地見聞廣博本史作於明神宗萬曆三十六年一六八取材頗多內容豐富於每一宗派之流衍亦率能道其原委如此完整之印度佛教史求之國中尚無其匹故為譯出以餉國人二本史篇幅頗多茲節譯其重要部分僅得全書三分之一但所刪去者皆係玄渺神話於原書精彩毫未減損也三本史西藏原文有德格版奈旦版兩種此本乃根據德格版譯出亦曾參考日人寺本婉雅之日譯本寺本氏譯本係假自陳大可先生陳先生並助余譯讀盛意可感謹於此致殷重之謝忱四譯筆除書名外全係直譯以保留原文之語氣情態五原本有章無節章名之標擧係在每章之後今按漢地著作習慣將章名提在每章之前並於每章酌為分節標題以便讀者觀覽六譯本於每節之後遇有解釋之需要者曾參考寺本氏之譯本及其他佛家典籍略為註釋或可供讀者觀覽之一助也一九四五年七月七日王沂暖於重慶
