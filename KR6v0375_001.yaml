body:
  text: 達喇那他著王沂暖譯第一章善見王時代一大迦葉與阿難陀在昔正等覺者大師之教初結集時諸天贊嘆一切人界安穩歲豐眾天人等和樂而住善見王者亦稱阿闍世王彼王福澤自然增長除弗栗恃城外其餘五城不待戰伐一切內服爾時如來以及雙勝舍利弗與目犍連與十六萬八千阿羅漢俱入寂滅大迦葉波亦般涅槃一切眾生甚為愁嘆已曾親見釋尊聖容之諸異生比丘咸自謂言佛在世時吾等因放逸故未得勝位於是憂勤專心修法有學諸聖亦復如是諸未親見釋尊聖容之初業比丘以未得瞻釋尊聖容於佛教授未能親炙若不精進當入輪廻如是思維亦於善法努力勤修以此之故得四果者與日俱增釋尊付法於大迦葉大迦葉付法於聖阿難陀教法傳播於焉開展聖阿難陀守護教法約經十五年時金色童子竭諾迦婆盧那童子證阿羅漢彼之傳記如金色童子因緣經中所載聖阿難陀能令眈於佚樂之金色童子無少障難證得阿羅漢果故阿闍世王於彼尊為等佛聲聞凡十五年間以一切資具供養阿難陀等五千阿羅漢焉聖阿難陀四十年間守護教法彼示涅槃之明年阿闍世王崩二商那和修聖阿難陀住於誓多林時居士商那和修於五年間興起僧伽大供養業後依皇者之教命出家次第憶持三藏證得阿羅漢果如是前後約使一萬比丘皆得證阿羅漢第二章蘇婆普王時代一末田提迦此後阿闍世王之子蘇婆普王賢手承繼大位約十七年崇信佛教彼時聖商那和修亦於教法少事守護而主要者則為聖末田提迦居於波羅奈斯為四部眾傳授教授為婆羅門及諸居士宣說正法一時波羅奈斯之婆羅門及居士眾以諸比丘托缽行乞頗生嫌厭謂諸比丘言豈無餘處可乞食耶豈較波羅奈斯無更富之國耶但見吾輩供養君等未見君等少遺吾輩於時聖末田提迦有萬阿羅漢大眾環擁向空飛逝止於北方烏尸羅山彼處有居士名阿闍者廣集四方一切僧眾於一歲中修供養業阿羅漢來會者為數四萬四千以是因緣北方佛教極為興盛末田提迦於烏尸羅山說法三年二商那和修之在室羅筏蘇底爾時聖商那和修住室羅筏蘇底為四眾說法證阿羅漢者近千人云第三章蘇陀奴王時代一末田提迦弘法罽賓彼王蘇婆普崩後其子蘇陀奴王賢弓承繼大位與末田提迦之調伏罽賓同一時代末田提迦前往罽賓自烏尸羅山招來五百日中眷屬自波羅奈斯招來淨信正法之婆羅門與居士眾無量百千共同住錫於罽賓諸國之人亦多次第前來凡大城九山村多處王宮一伽藍十二皆以無量僧眾莊嚴之於罽賓國徧植紅花建立佛教後即般涅槃傳說彼於罽賓弘法二十餘年云二商那和修之付法末田提迦去罽賓時聖商那和修為六大城四部弟子宣說正法蘇陀奴王在位二十三年而崩此後王之眷屬臣佐可二千人皆於商那和修處出家此後優波崛多以僅受具戒即得見諦歷時七日得證俱分解脫之阿羅漢於是付法於優波崛多於瞻波國入般涅槃由商那和修之講說教法前後因之得見諦者約十萬人得阿羅漢者亦及萬數於此罽賓國人皆謂末田提迦必須計入付法傳承諸人之中以末田提迦於摩揭陀中國守護教法歷時十五年彼時商那和修僅有少數弟子與之同住而已末田提迦去罽賓後始由商那和修守護教法故付法傳承者實有八人也餘人則謂末田提迦調伏罽賓固是釋尊授記阿難陀命之前往者然阿難陀付法之人則唯商那和修以故付法傳承僅為七代是說也西藏人士多取之第四章優波崛多時代一優波崛多之守護教法此後優波崛多渡過恆河至北方勝身國即底羅孚抵正西方之一國於彼處說法三月得阿羅漢者滿千人焉更往犍陀羅山說法亦令無量眾生得證見諦後更來摩揭陀國附近西北方之末土羅城於城門旁眾生集處有那達與跋達者常時讚嘆聖優波崛多乃以尸羅山之那多迦毗羅伽藍奉獻並供養一切資具於此說法有無量出家者與居士皆得見諦此後即住於那多迦毗羅伽藍以迄終生釋尊授記彼為無相好佛以除身無佛之相好外攝益眾生有與釋尊同等之事業自從如來般涅槃後廣利眾生無能過彼者也優波崛多守護教法時阿波蘭多迦王國日下最為廣大即蘇陀奴王之子大自在王守護國政九年與其子紮摩沙守護國政二十二年之時也二鬱多羅阿羅漢時東印度有阿羅漢名鬱多羅者大自在王甚信仰之婆伽羅國之民眾於雞護林建立伽藍供獻於彼即名雞園彼對阿波蘭多伽之四眾傳說教授得四果者甚多其上首弟子即阿羅漢耶舍也大自在王崩後紮摩沙王即位不久有名為闍薩之婆羅門老嫗年近百二十歲矣有子三人名闍耶蘇闍耶羯嚕耶那造鬱多羅阿羅漢處於三寶起大信心闍耶於波羅奈斯之轉法輪處建立像殿蘇闍耶於王舍城之竹林精舍建立像殿羯嚕耶那則建金剛座之犍陀羅即摩訶菩提之淨香殿後彼婆羅門三弟兄於三像殿各自常時供養五百比丘之食物於四方一切僧眾亦以資具而供養之第五章聖提多迦時代一優波崛多之付法復次聖優波崛多付法於聖提多迦彼之傳記有如下者於阿利耶闍耶國有一具大財富之婆羅門彼有一子名提多迦聰慧善巧而耽深沈之思通四吠陀與十八明處父甚愛之移時父死乃以一切家財布施沙門與婆羅門攜五百眷屬衣遍行衣前往遊歷十六大城於諸有盛名之外道及婆羅門處問梵行道無能圓滿為答覆者最後於末土羅問教於優波崛多深信於彼因而出家受具足戒優波崛多更為指示七種教授歷時七日五百婆羅門眷屬皆獲證得阿羅漢果聖提多迦則於八解脫而得禪定彼時各國婆羅門之眾多上首皆於佛教起最勝信心於時聖優波崛多付法於彼彼於六城等處傳教四部眾佛法得廣弘通使一切眾生皆獲安樂焉二提多迦一時於覩貨羅國有名彌那羅王者彼國中之一切居民皆崇奉虛空天除此而外於善惡無所知也聖提多迦來為彼等宣說正法王等千人皆得見諦無量眾民亦皆歸依受學之處夏季三月住於彼地比丘之數無量增加得證阿羅漢者及千人焉此後彼國與罽賓國間道路往來毫無擁阻罽賓國之長老多詣彼處教法大興僅此王及其子摩須耶王之時約建大伽藍五十其中皆滿住無數僧眾復有東方迦摩盧波國阿薩斯地方之婆羅門悉陀彼之財富可擬帝王有千眷屬奉日為神聖提多迦來為說法因生深信得見真諦以大敬信而造摩訶制多耶伽藍即於其處廣為四方一切僧眾作大施會以是迦摩盧波國境中佛法大為弘揚爾時西方摩羅婆國有婆羅門名無憍者未受灌頂之王也日殺山羊千頭以其血肉作護摩聖提多迦來廣為說法彼等懺悔罪業慚愧己行請問息滅罪惡之方便乃如聖者所示方便一切婆羅門皆受皈依而修學處於妙音居士之園中隙地造大伽藍如是於此國中佛教亦廣為弘揚此時約為距阿育王生後不久之時也彼等之後次第之間約有五百婆羅門眾守護教法饒益眾生歷時甚多彼付法於聖迦羅後於摩羅婆國之鄔舍尼示寂第六章阿育王時代一阿育王之誕生在屬於塔嚕地之搽牟波流那國有日種之涅彌達王大臣五百權力極大統治北方彼有六子一有善二有車三有螺四有財五有蓮六有金一時某長者妻與此王通因而有孕彼王母死除憂之日長者妻誕生一男以於除憂之日生故因名彼曰阿育迦無憂及其長也嫻習六十種武技八種觀相法字書算學皆極精通移時尼泊爾國與羯銖耶國之諸山民發生變亂阿育王受命與軍旅俱前往征伐無少阻難戡定山民徵課稅金受取贈物歸獻於王王曰汝之智勇實悅我心汝何所欲將以畀予答言我居於此諸兄害我請賜波吒釐弗多羅城為我居地並乞一切所用資具王即予之彼於此城中建五百園林千數歌女圍繞左右日夜受用諸妙欲焉二阿育王之即位此後摩揭陀國國王搽摩舍崩大臣婆羅門名犍毗羅尸羅執政多歷年所爾時彼與涅彌達王積不相能於恆河畔戰伐相尋久而不絕王子六人從事戰役適值涅彌達王崩逝朝中恐生死訊傳播摩揭陀人氣焰轉盛因祕之國政由二大臣共攝經七日後為京城中眾民所悉不聽彼二大臣之命乃奉阿育入即王位王子六人既勝摩揭陀獲得六城聞阿育王已即王位乃與五百大臣分別統治恒河北岸五城與鴦伽城此後一時與諸兄積不相能多年爭戰最後盡殺其六兄及五百大臣更破壞六城起雪山國迄瀕陀耶山中間之地皆被征服極為兇暴若未曾作刑殺之事便心不能安口不能食於每日晨判處殺戳縛打等刑此後方能平心甘味三阿育王與耶舍此後東方雞園住有堪布阿羅漢耶舍者往波吒釐弗多羅城每日於王前為王說法每夜於伽藍中傳教授於四眾王自晤阿羅漢耶舍即生誠信孜孜為善惟日不足每日供養三萬比丘此後阿羅漢耶舍為之宣說正等覺者釋尊授記勸以如來舍利法塔莊嚴大地乃於一日夜成就八萬四千法塔云第七章同阿育王時代一第二結集與十事非法之爭爾時聖提多迦未付法於聖迦羅前聖提多迦衰病多年惟住於摩羅婆國之憍實彌對四眾傳授教授毗舍利之諸比丘羣相謂言上座自身且有病患於彼處能得何真實教授耶故不去彼前而擅行非法十事並謂其為法為律為大師教阿羅漢耶舍等七百阿羅漢皆不謂然於華氏城之伽藍中由離呫毗族所出之王名難陀迦者為檀越而行第二結集此中所謂七百阿羅漢者乃六城分立之時僅居住屬於毗舍利城俱分解脫之多聞阿羅漢也是故此第二結集者乃部分之結集也彼之真實歷史載在毗奈耶雜事中此盡人皆知不更採入本史矣此結集出於此時代乃跋多伽底與克世面陀羅跋陀羅之說也並與於西藏現存之毗奈耶中所載釋尊入滅後經百十年時行第二結集之說一致本史使用即為此說於諸餘部毗奈耶中亦有於釋尊入滅後經二百十年或二十年而行第二結集之說於印度諸歷史中亦有言阿育王與聖提多迦等為同時於大善見入滅阿育王亦入滅之後而行第二結集者此則據前說而為說乃於毗奈耶雜事中所謂彼提多迦付法於大善見諸大眾謂諸大德等已入無餘涅槃彼時佛入滅已百十年矣之語生誤解也梵語所謂雅答吉答一助詞何時彼時二義俱轉於此處應譯作何時二百二十年等之說乃以半年計為一年與百十年說仍相符順此喇嘛班支達之說也班支達因陀羅陀達所著之史話中有曰若有謂言阿育王入滅後五十年聖優婆崛多出世於百十年時付法傳承畢此後勝者佛入滅後五十年聖優波崛多出世於百十年時付法傳承畢此後阿育王生等者與授記不合又與聖地可靠之諸史籍相違故此乃近似之言不可信也二聖迦羅於東方鴦伽國住一多財富之家主以無子故勤供摩訶提婆迦羅毗濕笯之像一時妻擧一男因為之名迦羅焉彼成長後兩親棄養於聖提多迦生起信心終乃出家從聖提多迦受具足戒此後一時聖提多迦入般涅槃由聖迦羅守護教法為四部眾傳授教授得四果者無斷絕焉於罽賓國數數宣說無我法義時逾三月於獅子國三月說法伽藍僧眾遍滿此洲證四果者所在多有此洲釋尊昔曾來錫釋尊滅後教法衰微聖迦羅至始廣弘揚最後付法王族之聖善見於北方古遐瓦那國入滅三聖大善見聖善見之父名曰見為西方跋盧迦黜搽國班頭族所出之王族也雄於貲財名其子曰善見彼子既長以園林五十美姬五十每姬各有侍婢五十樂女五十每日有價值五千巴那之花為之享樂其餘受用更不待言可與諸天相比競也一時眾多眷屬圍繞於彼前往園林路遇阿羅漢守迦耶奈與眷屬俱前往城中因生深信頂禮其足坐於一方阿羅漢為之說法即於座上證阿羅漢乃出家此後以聖迦羅為阿闍黎長時共住聖迦羅般涅槃後四眾由大善見調伏之以後聖者徧行南方普建伽藍各地僧眾徧滿焉於諸小洲亦安立佛教於大支那國等亦使教法少為弘揚無量眾生各使安樂此後乃入無餘涅槃復次阿育王幼年時為聖提多迦晚年之時彼王安住於罪行時為聖迦羅守護教法之時彼王轉成具法之王時為聖善見守護教法之時而大善見入滅後王亦遂崩焉現有從聖阿難陀至善見之因緣讚彼等之精要我則從克世面陀羅跋陀羅所取錄者而書之彼等之付法傳承為圓滿守護教法者所作事業與釋尊等彼等之後雖亦有眾多阿羅漢出然所作事業能如是與釋尊同等者則未之有也第八章離憂王時代一拘那羅王子阿育王有子十一人最善好者為拘那羅因彼之目與雪山之拘那羅鳥相類似故一仙人為命是名彼通一切技藝阿育王妃禘失羅叉鍾愛於彼誘惑之彼以嚴正不受誘惑王妃怒之一時阿育王兼患嘔瀉王妃以蒜為藥供獻於王服之即愈王欲酬彼答曰今非其時請俟異日一時西北遠方有阿須摩波蘭多國之瞿伽盧那王叛亂命王子拘那羅率兵往討於克彼王之時王妃禘失羅叉乞言於阿育王曰王錫酬賞今其時矣請以王國於七日間為我管理王即與之彼乃作一書令抉拘那羅王子之目竊王印信簽蓋其上遣使送往阿須摩波蘭多國爾時拘那羅王子自讀來書知為王命乃於抉目之時言曰請抉一目置我掌中如言行之前此也一阿羅漢預知彼將罹是禍乃為多說無常等法彼因時時思惟其義益以今見此目為緣遂以證得預流果去此後離棄眷屬攜一琵琶遍行諸國到達波吒釐弗多羅之象園為眾所識頂禮於彼諸民眾等未之知也黎明飼象人語彼其彈琵琶因彈琵琶而唱伽摩迦之曲焉王於重樓上聽之以聲似其子也天明察之果為其子問知原因大為震憤下禘失羅叉於膠舍命以火焚之王子諫止之曰若我一視禘失羅叉與我之子平等慈愛無瞋恨心時請將此眼復如前好遂復得一較前更勝之目焉二離憂王彼出家後得阿羅漢視棄王國如敝屣也由彼子離憂王繼承焉第九章第二迦葉時代一勇軍王此後生於北方犍陀羅之阿羅漢迦葉以聖教三事饒益有情時離憂王之子勇軍供養四方一切僧眾盡三年中於地上建一切法塔各以一百供養資具而為供養爾時於末土羅有婆羅門名具稱者因信聖教故建立一名沙羅婆抵之伽藍阿羅漢守羅那婆薩於彼說法四方眾多比丘來集為十萬比丘建大施會二大天之五事爭論彼時於摩盧多國之一地商主之子名大天者曾殺父母及阿羅漢作三無間業由悔己罪前來罽賓秘其所行而為比丘因聰慧故通曉三藏深自懺悔住阿練若勤修禪定由魔加持一切以彼為阿羅漢供養彼者與日俱增眾多比丘眷屬與俱前至沙羅婆抵伽藍諸比丘等以次誦讀波羅提木叉經於時次第及彼大天彼誦讀後更宣言曰一為諸天所惱二為無明所欺三道從聲流出四有諸疑惑五依他入此是佛之教諸聖者與諸老比丘言曰非經之語也諸餘大眾比丘黨於大天因興辯論此外彼於諸經義亦多作邪曲解說三跋陀羅之五事論彼死後有比丘名跋陀羅者亦謂為魔波比耶之化身彼於聖言違謬觀察多所懷疑於左五事竭誠宣揚一屢為他惱二無知三二心四遍觀察五救自己譽之為釋尊之教諸智慧不同之人所以求了解聖言者亦不同因之種種疑生爭辯不休更以各地語言解釋諸經因字類語音少有出入而詞句之種種差異亦因之生起諸阿羅漢與諸智者欲止此爭而諸異生比丘為魔所持辯終未息大天與跋陀羅死後彼二人之僻事諸比丘知之阿羅漢第二迦葉入滅後於末土羅更由聖摩訶盧摩與聖難陀迦作佛教之事業焉第十章聖摩訶盧摩時代一難陀王聖摩訶盧摩與聖難陀迦守護教法為時不久勇軍王崩其子難陀王即位二十九年間守護王國爾時於金砂國有婆羅門鳩舍羅智者出集會四方一切比丘歷時七年作大施會此後於迦尸波羅奈斯此王多年備置資具供養諸比丘二龍比丘之與四部分裂爾時有龍比丘者以多聞故屢讚五事引起僧眾之廣大爭論於是分裂成四部矣有名聖法勝者得阿羅漢果與最清淨比丘眾俱棄捨有諍之僧眾去之北方之地居焉三聲明家波膩尼難陀王之友人婆羅門波膩尼者生於西方毗盧迦之林園彼於三界中之一切聲明悉皆了悟造有波膩尼聲明之聲明論一千頌與解分別經一千頌共為二千頌此一切聲明論之根本也西藏人士以因陀羅聲明為最先出者但於天國所出者此為最先容有其理而於聖地則非最先以次應釋西藏所譯之栴陀羅聲明與波膩尼聲明一致而迦羅波聲明則與因陀羅之宗義一致此諸班支達之言也就中尤以波膩尼聲明演說所及範圍極廣能全通者殊希有云第十一章大蓮華王時代一十八部分裂之起源於北方邊地之婆那摩比國林地有火施王阿耆尼達多者出彼於三十餘年間供養阿羅漢法勝等聖者約三千人於摩揭陀國有聖大施摩訶覩耶伽者守護教法於華氏城難陀王子大蓮華王摩訶鉢士摩供養一切僧眾之時上座龍之隨行比丘名堅意者宣揚五事大興爭論此由四部分裂為十八部之始大蓮華王建立伽藍二十四所有謂於此時行第三結集者恐非是也二毗婆沙論之編造有謂婆羅流支造毗婆沙論卷帙甚多布施於諸說法者關於各種聖言典籍佛在世時雖已有之但製造釋論解彼聖言其第一部即此是也云此中所謂毘婆沙者乃為詳細解釋之義有謂於優波崛多時代為諸阿羅漢共同製作者有謂為耶舍與一切許等所造者西藏人士則謂為一切許與鳩浮闍等之五百阿羅漢於北方瀕陀耶山之舞人伽藍所製造此乃混合以上二說之論者勿問如何亦是彼諸阿羅漢之口授傳承集於一處由諸上座口耳相授後乃筆之於書者也三月護王與大乘之起源與大蓮華王殆同一時代而少後之時於歐堤毗舍國有月護王栴陀羅羅俱什多出文殊菩薩化比丘身至彼家為說種種大乘之法筆之成書此書諸經部師謂之為八千般若經而諸真言宗師則謂為打達桑木伽爾哈即真實攝也言皆可通但似以前說為近是此乃釋尊人滅以後大乘出現人間之始也第十二章第三次結集時代一師子善見與迦膩色迦王其後於罽賓國有師子王彼出家後名曰善見得阿羅漢說法於罽賓為持焰國闍蘭陀國之迦膩色迦王所聞生大信心北去罽賓從聖師子善見聽法於北方所有一切法塔興大供養於四方一切僧眾亦多建立大供養會爾時有比丘真勝者毗闍稱阿羅漢多所說法有大勢力從婆羅門與居士處多取資具二十萬僧眾討論正法約於是時分裂為十八部而大爭論作矣二脇比丘與第三次結集於罽賓國有婆羅門蘇陀羅者資財無量彼於毗婆沙師之大德法救及其眷屬與經部最初之師罽賓之大德上座及眷屬比丘五千常作供養弘揚三藏爾時東方有名聖脇比丘者出最多聞之阿羅漢也為迦膩色迦王所聞於罽賓國之環林精舍集會無量比丘而行第三結集此罽賓人如是云諸餘人等則以為於持焰國之俱婆那伽藍所結集者多數智者同意後說西藏人等之說則謂為集會五百阿羅漢五百菩薩五百異生班支達而結集者此於大乘宗義亦無不合然於彼時對佛教中諸大智者除祇稱之為大德外尚未有以班支達之名相稱謂者以故所謂五百班支達者為不應理也廓吉祥童子所譯記付法傳承軼事之一二梵文殘簡中有婆須蜜多羅等大德四百人之一句此應理也但如以此婆須蜜多羅為即毗婆沙師之大阿闍黎世友是則誤矣三第三結集與筆錄蓋於勇軍王之晚年難陀王與大蓮華王之全時代迦膩色迦王之初年四王之際僧眾之間生起爭論最激烈之爭論歷時約為六十三年而合前後爭論時期則幾近百年爭論息後於第三結集之時一切十八部皆成純淨佛教毗奈耶藏筆錄成書經與對法以前未筆錄成書者今成就之以前已筆錄成書者今校定之於此時代大乘各種經典已出現人間由得無生法忍之諸比丘略為宣說然猶未能廣大流布故請聲聞對之無爭議也第十三章大乘弘傳之初期一世友與妙音恰於第三結集終了之後迦膩色迦王崩去時於北方阿守磨波浪多與罽賓國之西方覩貨羅接近之地有一居士名闍提者富於貲財供養北方之一切法塔從西方摩盧國迎請毗婆沙師之大德世友與覩貨羅之大德妙音二人至本國十二年間供養比丘近三十萬人遂於無上菩提發心於普守迦羅婆禘宮殿之中迦膩色迦王子供養阿羅漢等聖者百人更為比丘萬人於五年間修大施會於東方華氏城有婆羅門毗度孚者出彼抄寫三藏無量卷帙施諸比丘復於三藏每種各有十萬頌如是抄寫約千次焉於彼一一復以不可思議資具供養而增益之二大乘之弘傳於波吒釐弗多羅城有阿羅漢名聖阿濕縛崛多者出彼乃於八解脫得禪定者因彼說法聖難陀蜜多羅等之阿羅漢輩出得見諦者所在多有於西方相馬王出作佛教之大事業焉西南之臊羅守多羅國有婆羅門具種姓王鳩黎迦出聞生於鴦伽國之大上座阿羅漢難陀是持大乘者欲聞大乘故因請彼至彼時於諸異國宣說大乘之善知識無量頓出大德阿毗達盧迦毗伽多羅國伽度婆闍提浮耶迦羅崛多羅睺羅蜜多羅惹諾那多羅與大優婆塞之僧伽多羅等之說法師約五百人出世三寶積華嚴等大乘經典之出世聖寶積經十萬法門一千會聖華嚴經十萬頌一千品聖入楞伽經二萬五千頌密嚴經一萬五千頌真實法集經一萬二千頌此各經卷從天龍乾達婆夜叉等宮殿所出而從龍國所出者為獨多是等諸阿闍黎多為婆羅門眾所迎請此事為相馬王所聞生大信心遂於阿武山巔建立伽藍共五百所每一伽藍中請一說法者供一切資具令己之諸眷屬眾具大信心而聰慧者共五百人悉皆出家受大乘法爾時王欲抄寫經卷問曰大乘三藏為數幾何答言總其全數雖不能計但現存者得千萬焉王曰為數雖多亦應抄寫遂寫一切所有經卷布施供養於諸比丘眾彼之晚年經卷安置於勝那爛陀於是大乘行者比丘五千皆能憶持無量經藏智慧無礙得無生忍亦曾於諸異生之前示現少許神變神通諸般遊戲是故大乘負盛譽者遍於各處為諸聲聞所難容認因起謗毀而宣稱曰大乘非佛說也諸大乘者一切皆為瑜伽師唯識論者彼等前此曾於十八部出家多數皆與彼等聲聞共住一千餘眾聲聞人中雖祇有一二大乘者雜居其間但諸聲聞人等不能勝之也四尊勝成就主與商羯羅主爾時於摩揭陀有婆羅門尊勝成就主無陀加羅果彌與商羯羅主商羯羅巴禘二兄弟出持優婆塞戒通一切乘如欲差別佛法外道之勝劣故尊勝成就主作殊勝者讚商羯羅主作勝於天讚於市衢中及五宮等一切處所廣為宣揚於金剛座供養聲聞比丘五百人於那爛陀供養大乘行者五百人五那爛陀寺之建造始末那爛陀寺者乃昔日聖舍利弗之生地後亦為舍利弗與八萬阿羅漢眷屬入滅之地中頃婆羅門村成為廢墟於有聖舍利弗法塔之處阿育王大興供養而建立佛教之大伽藍焉此後大乘最初之阿闍黎五百人商議並觀察曰若於聖舍利弗所曾住處說大乘法是諸大乘者能弘法之相也若於目犍連子所曾住處說大乘法但能獲得一大勢力而非於法增益之相也於是由婆羅門阿闍黎兄弟建立伽藍八所安置所有一切大乘經典故那爛陀寺之最初建立者為阿育王作為弘法之根本地者為五百阿闍黎與尊勝成就主兄弟增廣之者為羅睺羅跋陀羅大事發展者則龍樹也第十四章羅睺羅跋陀羅時代一祕密續部經典之出現此後有名旃檀那波羅王者出守護阿波蘭多迦之王國彼王之壽百五十歲享國亦近百二十年云於伽藍及僧眾大事供養此外所作佛事則未之見也爾時有婆羅門名因陀羅度盧婆者彼王之友也修因陀羅成就本尊問本尊以聲決定處將彼釋辭筆錄成書此即為因陀羅聲明云彼書有頌二萬五千約於彼王在位之時大阿闍黎婆羅門羅睺羅跋陀羅來難陀寺彼復從尊者迦羅受具足戒聽受諸聲聞藏或曰從羅睺羅光羅睺羅普羅跋受具足戒彼之堪布亦是迦羅也此之迦羅非付法傳承中之迦羅彼雖從阿闍黎無分別阿毗多盧迦等阿闍黎聽大乘法而主要者乃為從祕密主等諸餘本尊聽諸大乘續部經典而弘中道之宗義焉與此阿闍黎同時有尊者迦摩羅伽盧跋與伽那薩羅等宣說中道宗義之八大尊者出尊者富羅迦薩達磨末尼依聖除障面授口訣而獲證得無生法忍從下界中龍宮請出聖大集經十萬法門共一千品此外更由最初五百阿闍黎之眾多弟子將前所未曾弘揚之無量經部與續部請出前此所有作修瑜伽三種之一切續部與密集佛平等相應幻化網等無上部皆有約於此時薩計多奈城有比丘大精進摩訶毗盧耶於波羅奈斯有毗婆沙師之大德覺天於罽賓國有經部之大阿闍黎大德室利羅多等出彼等專弘聲聞乘二毗婆沙師之四大德此時尊者法救妙音世友覺天四人稱為毗婆沙之四大阿闍黎每人皆有弟子十萬云此之法救乃為頌論結集之法救此之世友乃為品類足論作者之世友與異部宗輪論作者之世友是異人而同名不可牽混而一之也依據密集聖龍樹一派所記載之史實則於歐提毗舍有毗須迦盧波王出應視之為與旃檀那波羅王殆同一時代者三訶梨旃陀羅王與十萬般若等大乘經之出現爾時於東方藩伽羅國有訶梨旃陀羅王出為旃陀羅族王之最初者依真言乘而得悉地室利薩羅哈又名大婆羅門羅睺羅於住於婆羅門行時瑜伽行之阿闍黎五百人輩出焉於彼一生中除十萬般若波羅蜜多外大乘經典亦多出世云第十五章聖龍樹守護教法時代一龍樹之弘揚中觀與難陀正軍真諦之唯識宗其後由阿闍黎龍樹守護教法努力宣揚中觀宗義於諸聲聞亦廣饒益從一切居處驅擯犯戒有大力者之比丘沙彌殆及八千人云彼為諸部之上首適於此時尊者難陀尊者正軍波羅摩斯那以及尊者真諦薩牟薩覩耶三人持瑜伽師唯識宗義造論無數於阿賴耶之解釋此三尊者說為前之瑜伽師無著弟兄說為後之瑜伽師非彼無著弟兄為前三人之徒眾此之所示甚明顯也聖龍樹居聖那爛陀寺於百八所伽藍中建立大乘道場百八處二聖龍樹之著書爾時聖者請至無量陀羅尼及一萬般若波羅蜜多諸聲聞云此乃龍樹所造也此後大乘經典無新出者為遮諸聲聞乘實性說者之爭論故而造尼夜耶之五輯於西藏諸歷史中謂有比丘商羯羅者為破大乘作明嚴論總百二十萬頌此乃誤說其實祇得萬二千頌三龍樹之晚年龍樹晚年來至南方調伏優陀延那王多年之間守護教法優陀延那王壽及百五十歲此阿闍黎有少七十一年未滿六百歲與少二十九年未滿六百歲之二說初說二百年在中國二百年在南方百二十九年在吉祥山住云者是粗略計算以半年計為一年此吾喇嘛班支達之言也後說除餘者與前相同外則言百七十一年住吉祥山四于闐與覩貨羅等國之佛教彼等之時代於于闐國有阿羅漢僧增僧伽婆盧陀那出復次毗婆沙之阿闍黎於覩貨羅有阿闍黎婆摩那出於罽賓有拘那羅出於阿波蘭多加國中央有作善苦世滿迦羅東方有阿闍黎僧增僧伽婆盧陀那諸人出經部之阿闍黎於西方有大德童受出每人皆有難以計數之眷屬訶梨旃陀羅王與眷屬俱化虹身後無子嗣位時為由彼侄阿苦叉旃陀羅與其子闍耶旃陀羅勝月守護王國之時代二王雖皆崇敬正法而於佛教所作大事無記載焉五摩罕默德之創立回教於南方有訶梨跋陀羅王與千眷屬俱獲成就梨盧悉地自大乘最初發達至此時期有百千人得持明位約於此時回教最初出現於世有謂於罽賓國大德室利羅多童受之略名入滅時代反出世者或有謂為大德拘那羅之弟子或有謂有持藏多聞而無信心之鳩摩羅斯那者出世毀滅三學為諸僧眾從道場中放逐而出彼大憤恚因而建立反抗佛教有力之法云彼至覩貨羅後之舒梨迦國更易其名為摩罕默德變更服製造有害法之回教第十六章正法第一次遇敵後興復時代一勝友王之破壞佛教阿苦叉旃陀羅與闍耶旃陀羅王彼二人守護阿波蘭多迦王國權力甚大以奉信三寶故計入七代旃陀羅中闍耶旃陀羅之子涅摩旃陀羅彼子波尼旃陀羅彼子槃薩旃陀羅彼子薩羅旃陀羅此諸王者以其權力不大故不計入旃陀羅七代或十代焉此中涅摩旃陀羅守護王國為時不久有婆羅門弗沙蜜多羅即勝友者為王近臣變亂盜國爾時婆羅門之勝友王等諸外道生起兵端從中國乃至闍蘭陀羅之眾多伽藍咸遭焚燬多聞比丘有少數被殺害多數逃往異國歷時五年彼乃死於北方之地此中如所謂佛教最初五百年向上增益五百年向下衰減之時約於龍樹在中國守護教法以前阿含之講說與伽藍之建立等日益精益約於龍樹在南方饒益有情時回教已創始約於住吉祥山時為婆羅門王勝友所害此之一切緣起佛教衰減之端見矣二破壞後之復興此後波尼旃陀羅王於摩揭陀國建王國時於東方藩伽羅國之毗施沙瞿陀地有瞿陀婆盧陀那王者既擅財富更具權力修復一切被破壞之伽藍擴充道場上座三菩提於佛之教法廣為植立廣弘聲聞藏於摩揭陀建立道場六十處爾時於西方茂羅達那之巴伽達回教之信徒大食蒙古王名哈陸者出世於印度境內此為回教發現之始云槃薩旃陀羅王之末年與薩羅旃陀羅王之時代東方有婆羅門伽尸闍達者出敬重供養昔日所建之一切道場尤於藩伽羅之須婆那爾伽謨城供養六十四說法者及每一人之聽法者各十人恢復衰退之教法彼等乃龍樹住於吉祥山時代與彼滅後不久時代出世者也第十七章阿闍黎聖提婆時代一提婆其後薩羅旃陀羅崛多王之子即密月者出世彼有極大之權力計入十代旃陀羅焉善惡雜作不皈依佛故不計入七旃陀羅此王之時聖那爛陀寺阿闍黎聖提婆與阿闍黎龍猛亦譯龍叫廣護教法此中聖提婆者龍樹之弟子錫蘭島王之子於龍樹滅後在彼處附近之南方諸地攝受弟子宣說正法而利有情爾時東方那利尼之寇爾達城有婆羅門無勝黑者出遍行諸國與佛教徒每辯必勝至聖那爛陀寺諸佛徒與辯未能勝彼請阿闍黎聖提婆至那爛陀長時興辯阿闍黎三度敗彼因以出家歷時未久即能持誦三藏此後阿闍黎聖提婆亦久住那爛陀寺最後更至南方攝益有情於南印度香至國附近之蘭伽那達傳密意於羅睺羅跋陀羅而示寂焉二龍猛與聖提婆同時南方有阿闍黎龍猛者真名為如來賢廣釋無量大乘經典於唯識中道亦略為闡明以後為聖那爛陀堪布歷時甚久此阿闍黎亦龍樹之弟子也三龍智於東方藩伽羅之鼠國有老夫婦二人育一子出家後精通三藏即阿闍黎龍智也彼於阿闍黎龍樹在世時為阿闍黎之近侍阿闍黎龍樹入滅後居於吉祥山邊一深洞中一心修行歷十二年得成就大手印最勝悉地壽命等日月即居住此處焉彼有二名龍覺龍智也四成就者新迦波等人復次成就者新迦波出於阿闍黎龍樹與近千人之眷屬住於北方烏尸羅山時為之弟子教之專修圓滿次第不久即得證大手印悉地阿闍黎釋迦友亦可斷定其為阿闍黎龍樹之弟子但其傳記則未之見聞大成就者沙婆梨波之歷史已記載於寶生一書中成就者摩騰格波亦被呼為龍樹師弟之弟子但非於此時代出世乃後出而曾親見龍樹者也第十八章阿闍黎馬鳴等時代一頻頭沙羅王與迦膩迦王此後旃陀羅崛多王月護之子頻頭沙羅王者於迦宇羅國出世在位三十五年彼王之時於華氏城建華嚴寺大阿闍黎摩咥哩制吒譯曰母使馬鳴之異名居之廣為弘揚大小乘法阿闍黎摩咥哩制吒之晚年頻頭沙羅王末弟之子室利旃陀羅王統治王國彼建一聖觀音殿於彼供養講說大乘之比丘二千人羅睺羅跋陀羅為聖那爛陀寺之堪布於彼建立淨香精舍十四所再建立不同之道場十四所室利旃陀羅王守護王國多歷年所時西方制哩與摩羅婆國有一少年迦膩迦王受命即位於四方分建伽藍常時供養大小乘比丘以三萬數但應知迦膩色迦王與此迦膩迦王非同人也二馬鳴此中阿闍黎摩咥哩制吒者前已述及之婆羅門無能勝黑即彼也韋羅勇者馬鳴摩咥哩制吒比咥哩制吒無能勝達磨彌迦須菩提具法善現與摩底咥吒羅皆彼之名也晚年之時迦膩迦王遣使迎請以年老邁不克前往乃造書翰入王於法遣弟子名智稱者於彼王處為說法阿闍黎彼更廣造般若要集其他之論於大小乘一切比丘平等攝益以不偏守大乘一方諸聲聞眾亦皆宗仰成為內道所共尊崇之人故聲譽極大三羅睺羅跋陀羅羅睺羅賢阿闍黎羅睺羅跋陀羅雖為戌陀羅族而容貌財富能力却極圓滿出家於聖那爛陀寺成為持三藏比丘依止阿闍黎聖提婆而證實性住那爛陀最後於丁瞿達親見無量光佛面向極樂世界示寂第十九章正法第二次遇敵後興復時代一大食之入侵此後於東方室利旃陀羅王之子達磨旃陀羅王出世於佛教最為崇信爾時於罽賓國有土耳其王壽可百歲為一大法王達磨旃陀羅王統治王國時謨羅多那國與羅睺盧地之藩得露又名苦尼摩摩富多之一大食王出此王與達磨旃陀羅王數起兵事後以土耳其兵征服摩揭陀全境破壞一切伽藍聖那爛陀損害亦重諸出家眾皆逃避遠方二佛方王之復興佛教此後達磨旃陀羅王崩逝彼侄繼位但為土耳其一臣僕耳無權勢也達磨旃陀羅王舅父之子波羅奈斯之王名佛方佛陀波苦舍者彼派遣說經阿闍黎往支那支那皇帝答禮以黃金贈佛方王彼以此財寶娛彼西方與中土之強盛諸小王彼與大食王啟兵端時苦尼摩摩富多王等殺戮大食勇猛戰士阿波蘭多迦及西方多數王國皆聽命於佛方王彼更修復前此被毀之一切神殿迎請僧眾於勝那爛陀寺建立道場八十四處爾時親見文殊之後摩底制吒羅後馬鳴為王之上師諸僧眾等則供養於王宮之上諸外道等則賜食於宮門之外如是已遭破壞之佛教重新恢復矣第二十章正法第三次遇敵後興復時代一摩耶黎迦菩提與牟提達跋陀羅此後南方俱梨守那羅闍有阿闍黎摩耶黎迦菩提說般若者出彼於中國建大伽藍二十所建法塔千所弘揚般若波羅蜜多法最後為土耳其強盜殺害於彼國出世之阿闍黎牟提達跋陀羅即眾喜賢者能誦數千部經彼更修復已遭破壞之一切法塔而各繚以新塔十所使一切婆羅門及居士入於淨信於中國更糾正諸出家眾不律儀過後至于闐於彼處多年利益眾生而後入滅二那爛陀寺之被燬如是約四十年間正法極為弘揚於聖那爛陀寺有王之大臣名迦苦陀僧訶者建一佛殿落成之日為一切眾民設大宴會有外道二人來乞施諸暴沙彌以洗物餘水濺之驅至門板間嗾猛犬噬之二人忿極乃修護摩於護摩之餘燼念誦真言而散布之火焰自起佛教道場所依之八十四伽藍皆遭焚燬尤其聖那爛陀之達磨捷闍全部經藏所在之神殿羅特那薩伽羅羅特那陀提羅特那坦陀迦三所大乘藏之一切皆藏於此此三神殿亦悉遭焚燬彼時羅特那陀提伽藍自庋置於九層樓上某經函中大水下注火因以熄凡水注處所有經函即未被燬以後取彼經函視之其中為五部續部之經函云或云僅為密集但無論如何是無上續部於彼之中密集在焉此乃不可爭之事實也於餘國所有伽藍亦多被焚燬彼二外道懼王懲處遠循北方哈薩牟國三破壞後之興復此後集聚各地之多聞比丘或曾憶持或藏書卷一切廣收記之成書佛方王婆羅門商俱婆羅門部黎訶蘇鉢底與眾多具淨信居士修復焚燬之佛殿此中大乘藏部以前出現於人世者可分為十五分約四分為破壞正法之前二敵所毀滅約一分不待敵人之損害而自毀滅餘約九分以遇大敵為緣而遭毀滅今之所殘僅一分耳聖寶積經一千會餘四十九會華嚴經一千品餘三十八品大集經一千卷餘九品入楞伽經僅餘如來藏品之少分如是而已第二十一章佛方王事業終了與羯磨旃陀羅王時代一經典之保存此後佛方王之晚年於歐提毗舍國近海處之一山頂建一伽藍名羅多那嗜哩前後三次安置一切大小經部論部祈長住世集會八大道場之五百比丘於近藩伽羅海邊之一山建立與羅多那嗜哩相似之伽藍名提婆嗜哩佛殿為大臣所建立經典為婆羅門商俱所集定獻神之一切資具為婆羅門部梨訶蘇鉢底所供養彼之道場及僧眾之生活為王妃所備給如是之婆羅門商俱於南印度羯甘陀羅建立金翅鳥碑塔二難陀富利耶等人之弘揚大乘佛方王之後達磨旃陀羅王之侄羯磨旃陀羅者出於彼等之時代有阿闍黎難陀富利耶阿闍黎小馬鳴與羅睺羅跋陀羅之弟羅睺羅蜜多羅羅睺羅友彼之弟子龍友等出彼數人皆弘揚大乘之人也但今西藏所存之百五十讚註釋作者之難陀富利耶為陳那菩薩等以後出世者從彼之註釋中亦可明白見出此時代者與彼殆為同名者也第二十二章無著兄弟時代一深方王一切所貴王等人其後適於羯磨旃陀羅王守護王國之時佛方王之子深方犍毗羅波苦舍營造王宮於盤揸羅城統治王國殆四十年於罽賓國土耳其王之子土耳其一切所貴王者壽百五十歲守護王國亦約百年彼夷罽賓覩貨羅伽闍厄今之鶴悉達諸國為藩屬敬重三寶建立供養佛齒之大法塔比丘日婆迦羅優婆塞法僧出各有五千比丘及優婆塞眷屬圍繞修觀般若波羅蜜多深方王即王位至二十年時羯磨旃陀羅王崩逝彼子部哩苦叉旃陀羅王統治王國權力衰退歐提毗舍之闍雷盧訶王統治東方國家之大部是等諸王之時代乃大比丘訶盧伽訶達之晚年與聖無著利益有情之時代阿闍黎世親佛使與僧使之一生上半期也阿闍黎龍友住世甚久彼之弟子有名僧護者出二密教續部之次第弘揚與龍智於此時代以前謂諸堪能者未曾弘揚秘密真言無上瑜伽者非也昔大乘弘揚以後歷時不久所出之一萬持明者與於烏仗那一切人得持明者多數皆依無上乘道而彼眾者由秘密主等於若百若千之堪能者會於頓時親見本尊為說密乘彼等一切皆化虹身於彼之後不立教授先此諸人勤力修行更守秘密彼等未得持明位前人皆不知彼等為修密咒行者若有具大神變昇於虛空或不現時人始嘆息曰噫彼等是修密咒行者也此時方知蓋咸如是也是故阿闍黎以續部次第教授弟子者亦絕無僅有焉作修續部之真言續部修行者雖自大乘發達以後甚為眾多但因修行守秘密故惟除修密咒者外所修為何人莫之知是以有諸事業與悉地無礙成就者也薩羅哈龍樹父子乃至成就者舍婆利哇中間之傳承持受人所共知也然此以前諸阿闍黎住於秘密無上真言之傳承者則未多見據行攝燈雖載有蓮華金剛與堪婆羅之出世但前者於聖地未見作饒益有情事而後者之傳記亦未之見是故由大婆羅門與龍樹父子等所造之無上部論尚有是等之外無上真言之註釋前此無多也云是等諸論亦如中觀王理諸書非為眾人所共知者惟付囑於得持明位者之龍智以後於提婆波羅王父子時始為弘揚約從此時後作修真言續部等約二百年間極為弘傳並有公開修行者瑜伽與無上瑜伽諸續部於證得悉地以前雖無公開修行之人但較以前為興盛各種釋論之製作亦出現有名之諸大成就者亦輩出此時阿闍黎馬勝大阿闍黎盧伊波與成就者紮盧波底等皆出世彼等歷史於餘處詳阿闍黎阿盧訶達羯磨旃陀羅王時代之持律三藏者彼修大寶瓶法成就三阿闍黎無著聖無著兄弟之傳記於佛方王時代婆羅門女名極明天性母者與一王族交會誕生一男面貌美好彼即無著遵母命出家受具足戒五年之間精勤誦讀後於鷄足山之洞中修聖彌勒觀行得親見彌勒菩薩彌勒問之曰汝何所欲耶曰願弘揚大乘教曰其牽予之衣角牽已無間至兜率天宮從無能勝依恃彌勒聽聞一切大乘教法於諸經義洞達無遺聽慈氏五法時僅聞每一部義即證各不同三摩地乃再至人界饒益有情此復彼阿闍黎於摩揭陀之一方名比盧婆那之森林中建立伽藍即居彼處為具戒多聞弟子八人宣說大乘甚深法義彼等皆得無生法忍為令眾生起淨信故彼等皆獲證得神通得渡經海達於彼岸故名彼處為法芽寺云於是處將慈氏五法筆之成書更造阿毗達磨集論攝大乘論瑜伽師地論五部地論現觀莊嚴論釋等多數論部其後來錫於薩伽梨城西方宇守摩富羅城一伽藍中深方王為之檀越集會四方一切比丘聖者無著為宣說契機之法解釋聲聞三藏及大乘藏約五百部於大乘之種姓覺醒者於藏義之智慧廣博者出現之人殆逾千數矣此復昔日大乘最極弘傳繼乃世運漸下人智轉低三次遇敵次第衰歇此阿闍黎出世以前大乘比丘為數雖眾而大乘之神通者則絕無雖盛誦讀各種經藏而知實了達經義者則絕無於此伽藍阿闍黎及與八大最勝弟子宣說正法於大乘教法如是衰微之時而中興之此則為各方所共認者也於俱黎濕那羅闍國與烏仗那國安住甚久對一切人弘揚大乘於此二國各建法塔百數建神殿二十五所在彼餘處亦各建立大乘道場如是於摩揭陀國亦建法塔百所道場二十五所復次於往昔之日大乘教法最興盛時大乘比丘未滿萬人龍樹之時多數僧眾亦為聲聞此阿闍黎之時大乘比丘有無數萬以此而論則是全大乘教之宗師也然與此阿闍黎共住之弟子惟二十五比丘晚歲住那爛陀寺十二年最後示寂於王舍城即於其處諸弟子眾為建法塔四阿闍黎世親弟世親者西藏人士或以為乃聖無著之孿生介弟也或以為其法弟也諸智者則不如是云以為彼父乃一成就三吠陀之婆羅門於聖無著出家之明年所生者此二阿闍黎一母之兄弟也於聖那爛陀寺出家聲聞三藏全部修學尚欲通達對法論藏再欲決了十八部執全通明處以故前往罽賓主要依止阿闍黎眾賢學習毗婆沙論十八部之論每部經律差別全部外道六師之書及與一切辯論理趣而精通之更於彼國多年辯析理與非理釋聲聞藏後至摩揭陀曾於彼國居留有年爾時未見聖無著所造瑜伽師地論於大乘法未之起信且言曰噫嘻無著於林中十二年修三摩地未獲成就徒製作滿載象背之教理云兄聖無著調伏彼後證得最勝三摩地爾時勝者聖言之在人間者皆了達焉佛入滅後如阿闍黎世親之多聞者無一人也云於聖無著入滅後繼為那爛陀寺之堪布此阿闍黎未遠至邊地多時住於摩揭陀國一度至東方伽宇羅國為歐提毗舍國婆羅門摩俱尸迦所迎請為一萬二千大乘僧眾歷時三月興供養會復次此阿闍黎亦令南方等地建立道場一切總計約與前等共建道場六百五十四處較聖無著在世時為多所有諸國一切總計大乘比丘約及六萬人云與阿闍黎共住之比丘亦可千人前後約破外敵五百使千五百婆羅門及外道趣入佛教最後阿闍黎與一千眷屬俱至尼泊爾於彼國中亦建道場僧眾之數無量增加見僧人居家衣法衣耕田畝中心生悲痛曰是乃破壞釋尊之教也於是為僧眾說法誦佛頂尊勝陀羅尼三反入般湼槃法曰暫沒云於彼入滅處諸弟子亦為建立法塔焉五俱舍論與眾賢如於西藏歷史中言俱舍論本頌造成後送致罽賓眾賢之前欲博其歡喜供其觀覽然未之喜也為駁辯故去摩揭陀而阿闍黎世親避往尼泊爾國云眾賢去摩揭陀印度無明文記載即許其去亦顯然為時甚早於世親往尼泊爾時眾賢入滅已多歷年所矣此中阿闍黎聖無著出家以後所作法事歷時約及七十五年經中所授教之壽命百五十歲者乃以半年而計為一歲者與法生活之年代相合利益眾生三十餘年於印度亦有四十餘年利眾生之說阿闍黎世親享壽約及百年於聖無著住世之時已經多年廣利眾生聖者無著滅後約利眾生二十五年此大阿闍黎者據云與藏王朵兜利曩贊時代相當頗可信也第二十三章陳那阿闍黎時代一室利訶盧沙王與毘伽摩旃陀羅王父子約當大阿闍黎世親之晚年時深方王崩逝以後出於西方摩盧國之室利訶盧沙王權力極大征服西方一切王國嗣於佛教生起淨信奉阿闍黎德光為上師約於此時東方部哩苦叉旃陀羅王之孫毘伽摩旃陀羅王與其子伽摩旃陀羅王二王守護王國此二王亦權力極強富於貲財而喜布施以法治國然未皈依三寶內道外道兩俱供餐尤信尼犍子離繫外道於罽賓國亦有一切所貴王出世云爾時於東方阿闍黎安慧與陳那利益眾生於西方則為聖無著弟子佛使利益眾生之晚期與德光利益眾生之極盛期也於罽賓大德僧使廣行利益眾生事阿闍黎法使則遍行一切國說法於南方有阿闍黎佛護來錫約當於清辯跋毘耶與解脫軍之一生中之前期也於歐提毘舍國有闍隸盧訶王之子那倡舍王與大臣婆羅那伽計舍者出約七年間守護王國權力極盛毘伽摩旃陀羅王亦禮敬彼為阿闍黎盧伊波所調伏棄捨王國得成就者為陀利迦波王與大臣真格波阿闍黎三寶使與清辯同時代於歐提毘舍國有婆羅門賢護者亦廣作佛教之事業二室利訶盧沙王破滅回教彼等之中室利訶盧沙王成為無敵之強王時欲滅回教於與摩宇拉斯多那國相近之一小國建立一回教稱為摩尸達者木製之大寺會集無數回教大師收集彼教無數經典悉皆焚之回教徒被焚而死者為數一萬二千人因彼王如是之破壞約百年間持大食之教法者尠矣三德光大阿闍黎德光者生於末土羅國之婆羅門族後於彼地一伽藍出家受具足戒於大阿闍黎世親處精習聲聞三藏與無量大乘經及異部律論十萬律部常默誦於心為室利訶盧沙王之上師四安慧阿闍黎安慧者南旃陀迦羅拏耶長者之子七歲時往阿闍黎世親處修學諸明其後持上座部三藏通達一切大小乘對法更造寶積經四十九會與中觀本頌之註釋約於阿闍黎世親入滅之時摧破外道吠守多波羅等之敵論而獲稱語自在五陳那阿闍黎陳那者生於南方信訶婆苦多羅城與香至國相近之一地之婆羅門族外道教理一切精通從犢子部堪布龍授出家通達聲聞部三藏後至阿闍黎世親處盡聞大小乘三藏住歐提毘舍之補羅娑伊羅山洞中勤修禪定歷時數年爾時於聖那爛陀寺外道與佛徒大起爭辯迎請陳那摧伏外道於彼處闡揚俱舍並多製作唯識因明之零星諸論總計造論及百部云再回歐提毘舍造集量論後往南方之地摧伏諸國外道甚多於古昔阿闍黎所建道場之頹敗者興復之更使歐提毘舍王大臣賢護趣入佛教此婆羅門建立大伽藍十六處如是摧破外敵甚眾稱因明之王法之弟子徧滿諸方長時隨侍之沙門未置一人少欲知足盡壽安住十二頭陀功德於歐提毘舍國之一森林間靜處示寂六僧使大德僧使世親之弟子也南方之婆羅門族為說一切有部之人彼住金剛座極久於金剛座建立毘奈耶與阿毘達磨之道場二十四處因為土耳其之一切所貴王三摩多王所敬重迎至罽賓建立羅覩那崛多伽藍與崑跋袞陀羅伽藍弘揚大乘教法即於彼國示寂於罽賓國其先大乘教法未有弘傳至無著兄弟時僅少流布自此阿闍黎以往始漸弘揚矣七法使阿闍黎法使者生於東方藩伽羅國為無著二兄弟之弟子遊行四方一切諸國後建立一聖文殊神殿而註釋全部瑜伽師地云八佛護阿闍黎佛護者生於南方坦婆羅國之哈沙苦利陀即於彼處出家學極廣博為阿闍黎龍友之弟子從僧護問龍樹宗義一心修行得最勝智住於南方檀多利弗伽藍說法於聖父子龍樹提婆與馬鳴等所造之論多所註釋九清辯阿闍黎清辯者生於南方摩盧耶羅之最勝王族即於此國出家從僧護學大乘經典及龍樹之教授至南方為南方五十伽藍之主廣說正法於阿闍黎佛護入滅後見彼所造諸論乃於中論另造釋論破斥前阿闍黎之見依龍樹之教授釋經此二阿闍黎立中道無自性論佛護弟子甚少清辯弟子極眾比丘數千隨侍左右彼之宗義廣為弘揚矣彼二阿闍黎未出世前諸大乘者皆住一教此二阿闍黎始峻別聖龍樹與聖無著之宗為二云無著之宗非示中道但為唯識而龍樹之義乃吾等之義此外無有也於是遮破餘等一切故清辯示寂後大乘內部分而為二爭論起矣此復阿闍黎安慧造中觀密意了別疏釋其書出現南方之地清辯之徒眾不之許也彼等造那爛陀與安慧諸弟子辯清辯之弟子勝諸無自性論師如是云月官與月稱爭論之理趣亦如是應知也西藏多數人謂佛護為龍樹前期弟子清辯為其後期弟子而興爭辯佛護轉生為月稱云此僅臆說耳十解脫軍聖解脫軍者生於中土與南方中間之儒婆羅洞窟附近為阿闍黎佛使之甥信解大乘後來世親處聽聞般若盡能憶持般若諸經然未聽受教授也於此更作僧護之最末弟子問般若教授於彼此阿闍黎如西藏所稱乃阿闍黎世親之弟子自通般若波羅密多云印度人士雖有謂是陳那之弟子未入世親之門下般若波羅密多之現觀問於法使般若波羅蜜多之教授則聞於清辯但聖地多數人所共許者全不如此彼乃世親之最末弟子此阿闍黎之諸弟子咸如是云復次此阿闍黎修觀般若心中起殊勝覺受無有疑義惟有一處經文與現觀莊嚴論相違不安於心爾時夢中聖彌勒授記曰汝其往波羅奈斯之伽藍可得大義利也翌日天明遂去彼地路遇優婆塞寂鎧從南方普陀山請至二萬八千頌之經經句與現觀莊嚴之論文符合心得寬慰焉乃以中道無自性論義釋八品經與現觀莊嚴論造般若莊嚴和雜之論如是之義此阿闍黎未出世前之所無也二萬頌出世之前他人未得寓目之原因以此故也云後為東方一小王之上師作二十四伽藍之主勤說般若聽經比丘最少時亦有千數如是歷時殆三十年十一三寶使阿闍黎三寶使者從世親聞對法藏更多依止一切異國之持藏者與陳那交誼頗篤與陳那之關係乃一聽聞般若之弟子以智慧論則等同陳那云復註釋八千頌攝義為讚譽此阿闍黎所造註釋之無邊功德陳那亦復造攝義焉後此阿闍黎去之南方作多數伽藍之主為無量眾生說法至土羅婆梨國新建立大道場五十長時弘揚教法後往百花山優婆塞寂鎧往普陀山亦同此時此優婆塞據二萬頌八千品之歷史所載三去普陀山第一次為己朝謁第二次為斷現觀莊嚴與經不同之疑波羅奈斯之僧眾遣彼前往未曾質疑唯迎觀音至質疑於觀音答言我乃化身不知也第三次為斷彼疑請還八千品此優婆塞為盜殺害第二十四章戒日王尸羅王時代一戒日王其後室利盧沙之子膩沙流伽尸羅王出信奉三寶發願飽供出家者食財富日增於彼四方一切比丘以妙飲食而為供養王宮名羅達城得壽百四十歲享國亦近百年約於聖德光之晚年即王位二信訶王父子與信訶旃陀羅王東方離咕毘族所生之王名信訶者出有大權力爾時阿闍黎月官生信訶王之子跋盧舍王享國甚久旃陀羅族之信訶旃陀羅王即王位權力微小聽受信訶王與跋盧舍王之教令此時為清辯與解脫軍之晚年阿闍黎日護與解脫軍之弟子勝軍佛護之弟羯磨羅弗提之晚年德光弟子月末尼那爛陀寺堪布勝天皆同時代出世者也於南方阿闍黎月稱亦出世約為阿闍黎護法與阿闍黎寂天成就者毘盧波之早年聖娑伽提婆亦似為此時出世者譯師湼角慧稱所譯之花鬘續中有聖僧使之弟子聖娑伽提婆造之言是故彼是否為聲聞阿羅漢尚待考證也彼等中未聞有勝軍與羯磨羅弗提之傳記月末尼為膩沙流伽尸羅王之上師亦無多事蹟可考日護者為主張聖龍樹與聖無著之意見為一致者云於罽賓與摩揭陀各建立大道場十二處勝天亦為通達無量經典之大阿闍黎也久住那爛陀詳細傳記則未之見聞三佛齒之供養爾時北方訶娑摩有一佛齒出阿闍黎僧使之弟子文章家密授與法使之弟子羅陀那摩咥等四眾如法行者無量百千出世供養佛齒彼之傳承今普康之地尚有遺存四具吉祥月稱具吉祥月稱者誕生於南方之薩曼多幼習諸明即於南國生地出家盡通諸藏於清辯之眾多弟子及佛護弟子羯磨羅弗提處受龍樹宗義及一切教授成為智者中之大智者為那爛陀寺之堪布造入中論等三書及六十如理論釋等盛弘佛護宗義後至南方於崑迦那多破外論使無量數婆羅門與居士眾趣入佛教建立眾多大道場嗣於摩笯藩伽山欲依真言道得最勝悉地居留甚久化虹身而逝諸真言阿闍黎如是云五阿闍黎月官阿闍黎月官者東方婆連陀羅王族班支達毘斯沙迦之子皈依一大乘阿闍黎受學五明於大阿闍黎安慧處多分經論纔聞即了於持明阿闍黎阿輸處受學教授修習明咒成為極大之智者更於東方跋盧舍王國中製作醫方韻律工巧諸論尤廣釋聲明被王置箱篋投之恆河中浮至恆河與海相會之一洲上傳說此洲為聖多羅母所變現者旃陀羅毘婆原名也旃陀羅果彌月官乃住於彼處後所得之名也彼洲至今尚存在約一能容七千村落之地云後隨商人至錫蘭島建獅子音神殿更為增益工巧醫方等諸明處亦講大乘法更至南方閻浮提地於婆羅門婆羅流支之神殿中見有從龍所受之聲明及龍施舍所造之波膩尼註釋因斥之曰龍者甚愚言多義少重複不完於是於釋波膩尼義而造旃陀羅文法於此書中言簡義明極為圓滿不取義於龍焉六月稱與月官之論辯此後來明生處聖那爛陀寺月官依無著宗持唯識義月稱依龍樹論及佛護等釋而持無自性義七年之間論辯不休為觀論辯無量眾民常時會集村中童年男女以上皆解宗義因為歌曰嗟嗟龍樹宗有藥亦有毒慈氏無著書眾生之甘露此後被請住錫那爛陀寺多說正法造讚百人頌內明論百人頌外論百人頌工巧明百人頌單行小書四百三十二頌又造名波爾地波摩利論指示全分菩提道次於切爾馬土羅毘羅國與錫蘭島講說此書之風氣今尚存焉二十律儀與入三身論為後出一切大乘班支達所修學云救度母百成就法觀世音百成就法亦此阿闍黎所造西藏有譯本總之其所自造之書甚多也如是長時利益有情後欲往普陀山從閻浮提來檀那室利於彼供養吉祥積米法塔建立度母神殿百數聖觀音神殿百數於普陀山示寂其遺體至今尚在與弟子書者王子寶稱還俗彼自普陀山託諸商人致書於彼王子見書後復如法修行云上述之中月稱與月官之前半生時應知為信訶王與跋盧舍王在位之時亦護法之前半生之時也月稱與月官在那爛陀會晤為其後半生之時阿闍黎護法利益眾生時為第五信訶王之時也第二十五章紮羅王與第五信訶王時代一紮羅王第五信訶王婆羅斯那王跋盧舍與信訶旃陀羅王之崩逝時代於西方摩羅婆國有紮羅王者具大權力曾於膩沙流伽尸羅王略作損害彼享國三十年而與膩沙流伽尸羅王同時崩逝於東方跋盧舍王之子第五信訶王具大權力信訶旃陀羅王子婆羅旃陀羅王出世於藩伽羅國得國於底羅孚抵第五信訶王統治之地北至西藏南至覩隣伽西至波羅奈斯東至大海之邊爾時有勝軍之弟子調伏軍摩揭陀之大德解脫軍德光弟子對法學者德慧阿闍黎護法自在軍罽賓之一切智友與摩揭陀跋盧舍王之季子國土雖小財富却極大之婆羅斯那王等出世更有征服南方瀕陀耶山附近之一切國之普濕波王出世彼中紮羅王於王宮四方各建伽藍於四部眾供養衣食財等良好資具十二年間前後總計約二十萬人第五信訶王於內外道俱供養更建內道道場二十四所及多數法塔婆羅斯那王供養那爛陀寺月稱月官一切智者供養百八道場於摩揭陀一切神殿及法塔供養尤豐二調伏軍與解脫軍調伏軍與解脫軍之詳細傳記未見調伏軍建造無能勝依怙像迎請月官造度母像解脫軍修無能勝依怙悉地獻護摩百二十萬三德慧阿闍黎德慧者善巧一切明處造俱舍釋與中論釋隨順安慧而破清辯清辯之弟散般羅土多亦與之同時代生於東方婆羅普黎長時爭辯為法慧所勝云四護法阿闍黎護法者生於南方詩人之家為優婆塞時即為了達一切內外宗義之大詩人從阿闍黎法使出家受毘奈耶得成大智者來中國後更從陳那聽受一切經部及其支分成善巧自在者能誦大部經百餘數在金剛座說法三十餘年繼具吉祥月稱之後為那爛陀寺之堪布彼曾造中道四百論之唯識疏此疏顯於月稱造四百論疏以前而作於金剛座者月稱護法二人俱以阿闍黎法使為依據者也晚年至東方金地蘇伐剌拏土毘巴成就鍊金液悉地最後乃去天宮彼為那爛陀寺堪布歷時甚暫後勝天繼為堪布彼之弟子為寂天與毘盧波五寂天寂天者搜羅守多羅王之子也將即王位前夕避去至林窟一瑜伽行者住處即於彼處受真教授修不可思議之三摩地與智慧後至東方住於第五信訶之眷屬內故得通達一切技藝智慧增廣勸王以法治國建立內道道場二十嗣往中國從堪布勝天出家名曰寂天說入菩薩行論去之屬於覩利憐伽之迦隣伽城六一切智友一切智友者為罽賓某王之庶子初時為鷲所掠持置於中國勝那爛陀寺之淨香殿屋頂諸班支達收養之及長甚為聰敏乃至成為持藏比丘乃日護之弟子也七曇毘黑盧迦與婆日羅犍達即於此時大成就者曇毘黑盧迦與大成就者婆日羅犍達亦出世彼諸人出世時同而得成就略有前後次第毘盧波得成就後約過十年曇毘黑盧迦得成就又此後約十年婆日羅犍達始得成就月官之弟子長者子蘇伽提婆亦同此時出世第二十六章吉祥法稱時代一動堅王極明王等諸王紮羅王崩後彼弟動堅王紮羅蘇恥羅王享國二十年西方大部皆被征服其子毘濕笯羅闍王多年守護王國爾時統治中國及西方之大部者為底達王之子極明王般羅底達與彼子摩訶蘇耶尼王於北方般羅底達之弟摩訶釋迦婆羅王釋迦大力住訶黎土婆羅城罽賓全境皆聽命焉藩伽羅迦摩流波與底羅孚抵三國為婆羅旃陀羅王之子毘摩羅旃陀羅王無垢月所統治此中動堅王與毘濕笯羅闍王平安守土如法治國於佛教作何事業則未見明文記載餘人則皆篤信佛教復次般羅底達王與摩訶蘇耶尼王一心專敬吉祥法稱摩訶釋迦婆羅王則尊崇大對法論師之世友無垢月王則尊崇班支達阿摩羅信訶寶稱與散般羅土達之弟子中觀論師吉祥密室利崛多諸人此復約於此時整個言之佛教雖甚發達但較之無著兄弟與陳那在世時則於東方及南方之一切處外道增盛而佛教衰減矣二商羯羅之對抗佛教復次於第五世信訶王之時代有外道阿闍黎兄弟二人出長者名陀達渡雷樂耽三昧次者名商羯羅阿闍黎成就大自在天彼於藩伽羅國興起辯論諸佛教敗約有道場二十五所所有資具失於外道使彼諸道場空無所有優婆塞約五百人被迫入外道如是於歐提毘舍亦有商羯羅阿闍黎之弟子名跋多阿闍黎者於彼居地廣與內外道辯內道有班支達名俱黎舍守裂守達精通聲明及辯術建立教軍而與之辯外道獲勝復毀眾多內道道場其尤甚者奪諸教民與道場焉後此之時乃護法大德月月稱滅後之時也此時於南方有稱外道辯論之王之婆羅門遊戲童子與大天之信徒持牛戒者之米齊聲二人焉彼二亦於南方諸國多興辯論佛護清辯法使陳那諸人弟子及諸所有聲聞僧眾未能遮破彼等辯論內道財富及其教民多為外道婆羅門掠奪以去此者於前所說者時代較後也三提婆濕摩羅與寶稱之註釋中論爾時阿闍黎護法之弟子提婆濕摩羅思破月稱造中論白顯釋於南方與一外道辯而勝之有一名娑羅婆訶那王者趣入佛教興建無數神殿法塔並建立道場於此王時成就者瞿羅俱什出阿闍黎菴摩羅信訶之詳細歷史則未之聞焉寶稱造有入中論註釋云四世友與十八部之分裂世友亦曾作阿毘達磨俱舍論註釋異部宗輪論之作者即彼也世親住世以前十八部皆已完成此先佛教遇敵之時即轉式微僅餘少分於此時由辯論因緣與時會推移更沈沒矣從大眾部分裂而成東山部西山部雪山住部三部從說一切有部分裂而成迦葉部與說分別部二部從上座部分裂而成大伽藍部從一切所貴部分裂而成守護部彼餘諸部尚弘傳也此中諸聲聞修持之教者五百年後已漸衰退持聲聞之教理者至今尚多有少數佛教史學者謂大乘弘揚之後不久聲聞諸部即轉衰息更謂大乘教部已既建立此後聲聞勢轉微弱約於此時持聲聞者當無多也此乃臆度無識之論也五法稱具吉祥法稱者生於南方主陀末尼國佛頂末尼此以前一切班支達之言也但至今日無與彼國相似之名法稱之生地為覩黎摩羅耶國內道外道一切皆通昔時此地名至陀末尼則決定也其生時為第五信訶王與底達王即位不久之時代則甚顯然為婆羅門族之外道遍行者樓盧難陀之子幼小之時即擅巧慧努力研習工巧明處吠陀與其支分醫藥音韻外道教理等年約十六或十八時精通一切外道教理諸婆羅門盛為讚譽約於此時見一佛典於焉生起最深信解乃改著內道之優婆塞服為眾婆羅門所共驅擯於是來中國從阿闍黎護法出家全部三藏無餘了達合計契經及陀羅尼真言一切能持誦者達五百部其餘眾多因明書論雖曾聽聞意猶未愜從陳那弟自在軍一聞集量等自在軍二次聽聞已等陳那三次聽聞知阿闍黎自在軍尚有未達陳那密意之違謬處因以言於阿闍黎前阿闍黎最極欣喜言曰汝等陳那矣可破斥一切違謬於集量論別造註釋得阿闍黎如是開許乃造讚頌六法稱與遊戲童子之辯論或云此後欲習外宗密言服僕役服去之南方詢於人曰有誰善巧外道義耶告之曰通外道義而無敵者遊戲童子也即於彼處了知一切彼宗心要如何破彼一切理趣深印於心去之嘎迦俱訶具有宮殿之市場於覩流孚摩黎葡王之所在地廣張告語曰欲辯論者有伊誰耶有持米齊仙教理者之婆羅門迦那崛多復有持六見教理者約五百人咸來集會辯論三月次第折服此五百人使入佛教於彼等中豐於財者約五十人使各建立內道道場遊戲童子得聞此訊極為憤恚親與五百婆羅門眾前來論辯於是與辯遊戲童子不共之宗有五百數於彼一切各以百數吠陀法門而摧破之於是使遊戲童子趣入內道彼諸五百婆羅門眾知惟佛教是應理者乃皆於佛教出家七法稱與商羯羅之辯論復次於離繫外道之羅孚部羅填行者之部孚伽羅具孚耶婆羅門之鳩摩羅難陀外道辯論之王迦那陀樓盧等住於瀕陀耶山窟之一切敵論者亦悉數摧破之此後更至土羅婆利國振鈴而問堪辯者誰外道等眾多數避逃少許自承不堪興辯乃於彼國修復前時被破壞之一切道場於諸林園閒靜處所修習禪定爾時於聖那爛陀商羯羅阿闍黎欲興辯論致書彼寺彼等咸謂應俟明年乃作後期因從南方迎法稱至辯論時至婆羅門等及諸外道一切皆為極明王所召請羣集波羅奈斯王與臣工眾人列坐其外商羯羅阿闍黎與吉祥法稱居中辯論將興商羯羅言曰我若獲勝君等諸人或沈恆河或入外道由我裁奪若君等勝我寧跳恆河而死辯論乃興法稱數數敗商羯羅最終使彼無可置答商羯羅欲沈恆河阿闍黎止之不聽謂其弟子跋多阿闍黎曰汝與之辯勝此薙髮者若不能勝我將轉世生為汝子再與彼眾辯言已自溺而死彼之弟子自命遍行梵行者眾胥入佛教諸餘人眾避之遠方此之明年跋多阿闍黎生一子跋多阿闍黎於七年時重復如前建立教軍而與之辯跋多所論皆敗自沈恆河死於是彼之長子即第二跋多阿闍黎與商羯羅阿闍黎之轉世者及堅執己教諸婆羅門皆遠逃東方直心婆羅門約五百人於佛教出家五百人皈依三寶於摩揭陀有婆羅門富盧那於末土羅有婆羅門富盧那跋陀羅彼二俱雄於財雅擅辯論次第來辯阿闍黎以正理伏之使入佛教二婆羅門各於摩揭陀與末土羅建立五十內道道場於是令聞美譽遍一切地爾時於瀕陀耶山中有華王之子廣華王征服村鎮三百餘萬殊勝財富與天相等彼去此王國中巡行次第到達王之宮殿王問誰乎答曰具智慧者為陳那月官之說極清淨韋羅佳什善通達勝一切者非我誰問曰其法稱耶曰世間如是見稱彼王亦為廣建伽藍使法稱居之七部量論亦造於此地居此長時廣弘佛教此國比丘之數達萬人建立道場亦約五十所此後至邊地具日羅達國亦使彼處婆羅門眾與外道等多入佛教建造瞿達富黎佛殿八法稱與轉世商羯羅之辯論爾時商羯羅阿闍黎已既轉世聰明智慧過於前生並善辯論其年約及十五六時欲與法稱辯來波羅奈斯請於摩訶蘇耶呢王振鈴諸方自南方迎請阿闍黎至婆羅門眾約及五千王及庶民數乃無量皆悉集聚一如昔日建立教軍而與之辯大摧破之亦復如前溺死恆河於時有眾多婆羅門見己宗義理應遮破乃有多人改信出家復有多人作優婆塞爾時有名毘度耶信訶提婆毘度耶迦羅提婆信訶之三大婆羅門阿闍黎自罽賓國詣法稱前以誠直心廣研教理法稱亦以實智訓指乃於內法深生淨信因之皈依受五學處並聞教理聽七量論更轉善巧既歸北方罽賓國內於法稱之因明論盛為弘揚於此中頃長時住於波羅奈斯以後更至南方於前佛教未弘通處或衰微處與諸障損佛教者辯而摧破之以法攝伏王與臣眾僧伽大眾與諸道場無邊興盛此阿闍黎建立神殿約及百數勸他建立數亦無量因此阿闍黎激勉之力入佛教者比丘與優婆塞以上總計約及十萬人晚年之時商羯羅阿闍黎復轉生為跋多阿闍黎之孫智慧之力較前尤大乃之南方與法稱辯法稱勝彼遂入佛教即於南方以婆羅門而住優婆塞行崇信佛教云彼所建之佛殿至今尚存此後法稱欲命終前於迦隣伽國建立伽藍使眾民等多入正法遂示寂焉此阿闍黎謂與藏王松贊甘普同一時代此說尚可信據九六莊嚴六莊嚴中龍樹無著陳那三人是造論者而提婆世親法稱三人是造釋者各於彼等之時代隨宜明教事功相等故稱為六莊嚴也十盧婆波諸人婆羅門商羯羅難陀為以後出世者以之為法稱之親愛弟子則大誤矣爾時得成就之瑜伽行者有大阿闍黎盧婆波中因陀羅部孚底顧顧羅闍阿闍黎蓮華金剛海生金剛與羅黎多婆日羅此諸人者殆同一時代此中阿闍黎顧顧羅闍者皆稱之曰狗王有少數史傳稱之為顧達羅闍於上所舉諸瑜伽行者中彼最著稱十一羅黎多婆日羅與黎羅婆日羅阿闍黎羅黎多婆日羅者乃那爛陀一班支達去烏仗那國自烏仗那去之陀摩犍闍為欲利益未來有情迎請夜魔敵等續部彼之弟子黎羅婆日羅筆錄阿闍黎之講述此據聖地所遍傳者瑜伽自在之毘盧波者修夜魔敵金剛亥母為之加持因得悉地以成與夜魔敵不二之瑜伽大自在者故能教授一切續部迎請紅夜魔敵續部並如薄伽梵所說修法教授筆之於書彼之弟子曇毘黑盧迦迎請俱盧俱黎修證法與阿羅黎二種續部作無我女成就法與俱生成就其後阿闍黎盧婆波與海生二人迎請喜金剛續部盧婆波造名蘇婆散吠陀富羅俱黎多以講圓滿次第為主之論海生造生起次第修法甚多喜金剛父部修法之最初者即海生所造之法也東方大阿闍黎中道論派之室利崛多吉祥密其歷史亦未見聞也第二十七章瞿毘旃陀羅王時代一瞿毘旃陀羅王等諸王此後毘濕紐羅闍逝去頃摩羅婆國未斷之舊王統種族中有跋盧達黎王出彼王女弟嫁於毘摩羅旃陀羅王而生瞿毘旃陀羅王於法稱入滅時亦彼王即位咸將即位之時彼二王俱為成就者闍爛陀黎與阿闍黎俱黎溫那紮隣所調伏於此頃成就者瞻底波亦出世彼乃摩羅婆國阿流拌底城之織布族此後瞿曇旃陀羅王之從弟羅黎多旃陀羅王在位多歷年所平安守護王國彼復於黑行之晚年受調伏王與大臣皆得成就此羅黎多者乃旃陀羅族諸王之最後出者也自是而後旃陀羅族之王族雖多然未有得國者而藩伽羅國與歐提毘舍等東方五國中之王族大臣婆羅門大長者等祇於自家稱王而已守護國土之王未出也二唯識宗之阿闍黎爾時成就者有俱生遊戲王及那爛陀阿闍黎調伏天出彼造七部量論之註釋持藏者濕跋密多羅阿闍黎戒護扇抵蘇摩等亦出世持唯識宗義以為根本弘揚經律九般若之著者阿闍黎幹波羅巴與室利崛多之弟子大阿闍黎智藏等則持無自性中道義於東方藩伽羅國所屬訶恥富羅之優婆塞尊者無性出亦弘唯識中道義又於覩貨羅國毘婆沙大持律阿闍黎法友亦出世於東方摩盧國大持律者福稱於恥多婆羅國持律者寂光於罽賓國持律者母奴諸人亦出世三智藏阿闍黎智藏者生歐提毘舍國在彼國成為大班支達於藩伽羅國室利崛多處聞持清辯義稱為大中道論者四無性優婆塞尊者無性者出商人族五法友法友僅有略傳於餘處見此之法友與略釋顯義註作者之法友為同人云以彼為德光之親炙弟子者則遠而又遠之言也視為與聖解脫軍及師子賢為同時代則近是矣六長尖法冠之創製爾時於東方辯者輩出但如此前有大勝負之大辯論者則未之見低等辯者則時有焉以依法稱宗義辯故內道辯論者較前為易但時代日降善巧者少外道論敵日有增加一切小伽藍中所有內道辯者心懷怖畏藩伽羅國之毘世娑紮底伽屋城之賓陀伽藍翌晨許與多數外敵辯而心懷能勝否耶之疑慮一老女現前曰如頭戴棘刺冠則辯論可勝也從彼之言乃獲勝利餘處亦爾同獲勝利自是而後諸班支達頭戴長尖法冠之風次第盛矣於波羅王統治七傳與斯那四傳之時代大乘諸班支達皆戴長尖法冠為前此所未有也七無上瑜伽部之興盛大阿闍黎法稱以前佛陀之教光明如日自是以降諸大堪布雖於佛教所作事業極多能等前此諸阿闍黎者則不世出雖或出已因時代日下昌明佛教能如此前者則未之有也自聖無著住世之時乃至此日真言成就者所在多有而無上瑜伽之法除弘傳於堪能者外於諸眾人全未傳授從此而後無上瑜伽續部漸次弘揚臻於極盛於此中頃瑜伽續部亦極興盛解釋作修二續部並修學者次第衰息矣以此之故真言金剛阿闍黎業與悉地隨應成辦於波羅七世之時出世極多之原因亦以此地約於此時旃陀羅小王得悉地者之普羅迦舍旃陀羅即極明月出廣說瑜伽續部復次內道成就之阿闍黎八十四人彼中半數以上為法稱時代以後如下所說之紮那迦王以前出世六莊嚴住世之頃大乘之諸阿闍黎皆極善巧諸僧伽眾亦復賢良但此之外以數量論惟聲聞僧居極多數略從此時南方佛教轉形式微旋即息滅於諸餘國亦復漸次淪於衰息七波羅時於摩揭陀藩伽羅歐提毘舍等之阿波蘭多迦王國及罽賓國却甚興盛於諸餘處亦惟零星散見而已於尼泊爾小國境內弘傳轉盛於彼等處亦惟密乘與大乘極盛聲聞部雖亦盛然所有賢明之王及庶民皆信大乘復次大乘昔日主要為釋諸經釋論僅附及之而已後此則一反前習除略釋般若波羅密多外而主要者則為解釋諸阿闍黎之所著書此種風氣極為興盛第二十八章瞿波羅王時代一瞿波羅王之治世於中國與東方之邊界間有一王族之女產一美男及長去之東方爾時藩伽羅國無君已多年矣選彼長稱為王上尊號曰瞿波羅初期統治藩伽羅國後更兼治摩揭陀於歐丹多富黎附近建那爛陀寺於彼二大國中多建僧伽部崇信佛法并弘揚之阿闍黎彌滿娑迦行者入滅之明年為此王即位灌頂之年云者此因陀羅陀達帝釋授之說也是過七年後云者此克施面陀羅跋陀羅之說也統治王國凡四十五年此王在世之時寂光福稱之弟子阿闍黎釋迦光生於西方於罽賓國利益眾生罽賓國更有摩訶檀那尸羅異友智鎧與持律阿闍黎韋羅諸人出世二中觀自續派之傳承於東方亦有阿闍黎智藏駐錫而或以為清辯觀音禁佛智足智藏靜命等人皆中觀自續派之以次傳承者然據靜命之中觀莊嚴疏未見有師子賢所造之八千般若經大疏以佛智佛智足為師子賢之弟子是則未之思耳又以佛智之弟子為智藏則更見其愚不可及也三釋迦慧戒賢諸人與小毘盧波釋迦慧戒賢與王子稱友地支諸人亦出世於罽賓國伏黎訶盧舍提婆王治理王國於此之時得成就者之阿闍黎出世者如上所敘可知也就中小毘盧波者顯然為此王與提婆波羅王之中間時代出世者也於西方迦擦國有毘跋羅達王出彼王之女嫁為提婆波羅王妃生王子羅薩波羅云於毘跋羅達王時小毘盧波出彼王之供養內外道皆有王所信者則為內道也一切臣工乃信外道不可思議之著作家大阿闍黎訶鈷多黎即出於此時代於瞿波羅王或提婆波羅王之中間時代吉祥歐丹多富黎伽藍亦已建立於摩揭陀有一內道之優婆塞建立歐丹多富黎大伽藍由彼自己建立道場臨命終時道場付託於提婆波羅王第二十九章提婆波羅王父子時代一提婆波羅王與蘇摩富黎伽藍之建立提婆波羅王者瞿波羅王之子瞿波羅王崩此王即位較之前王權力尤大佔領東方婆連陀羅國後乃建立蘇摩富黎伽藍有云蘇摩富黎伽藍之著名者乃新蘇摩富黎伽藍也二提婆波羅王破壞外道伽藍此王為瑜伽行者塞露米尼所勸請歐提毘舍外道神殿飭命自為破壞總計約破壞外道大道場四十所有謂藩伽羅國與婆連陀羅國者亦破壞焉嗣一切歐提毘舍皆為其所統治於此王時小黑行生彼乃阿闍黎黑行之隨行者於上樂喜金剛夜魔敵三者皆善巧通達之班支達也彼造上樂輪釋等書甚多世壽亦長及達磨波羅王後尚略住世三釋迦友善友智月師子賢諸人此時阿闍黎釋迦光之釋迦友出此外持律者善友賢慧戒牙軍智月金剛鋒妙音稱智授金剛天及南方大德觀音禁諸人亦出於罽賓國有施友等人出阿闍黎師子賢亦於此王之時成班支達於達磨波羅王時代大作佛事下當述之四來西藏之菩提薩埵來西藏之阿闍黎菩提薩埵於瞿波羅王至達磨波羅王之間決定住世則甚明西藏多數歷史亦記載於第九世藏王時為堪布指菩提薩埵入滅之時代如是言之則曾及見無著兄弟然究如何頗難定也一般皆認彼與中觀莊嚴論著者大堪布靜命二人為一人可暫置信彼於瞿波羅王時代成為大班支達於此王時為利益有情之領袖人物但智藏所造中觀二諦之註釋者之靜命與中觀莊嚴論作者之靜命若許其非為同人則彼二人中究係誰人應予考究也明矣五新世親與妙金剛提婆波羅王統治王國凡四十八年其後彼子羅薩波羅守護王國十二年間於佛教事業無新建樹不許入波羅七代焉爾時烏仗那國之阿闍黎妙金剛黎羅婆日羅十年留住那爛陀寺多說真言乘有一與世親同名之婆藪槃豆者出多說對法藏俱舍此中妙金剛者生於珊金國於烏仗那出家通達唯識中道及一切明處六摩騰格波與護足此時有一戌陀羅族之子謁見聖天獲龍樹父子之全部真言著述如應釋之此人即摩騰格波也於崑那迦有阿闍黎護足者親聞月稱說法而著照明燈一書如是班支達羅睺羅者亦曾謁龍智龍樹一派密法開始興盛以後於波羅四代時極為弘通有天上兩日月地上兩光明之諺云第三十章吉祥達磨波羅王時代一達磨波羅王與師子賢智足其後彼王之子達磨波羅王即位享國六十四年並統治迦摩盧波底羅孚抵與溝駄等地領土極廣東至大海西至提梨之邊境北至闍蘭陀羅南至瀕陀耶山皆聽命焉以師子賢智足為上師於一切處普弘般若波羅蜜多與吉祥密集置通達密集與般若之班支達於上首約於此王在位之時成就者阿闍黎顧顧梨波亦出世於藩伽羅國作利益有情事彼之傳記於餘處詳此王即位即迎請諸說般若波羅蜜多者於阿闍黎師子賢乃所最信仰者也二超岩寺及其餘伽藍之建立此王共建道場約五十所中有三十五所為說般若之道場建立吉祥毘俱羅摩什羅超岩寺西藏則譯為映戒寺伽藍更於摩揭陀北鄙恆河畔之一小山巔建立大菩提身量之佛殿四周圍以內密咒乘之小佛殿五十三所及普通佛殿五十四所共百八所繚以周墻於中有班支達百八人三般若經之弘傳此王而後般若弘傳極一時之盛般若經弘傳之國大別之則為最初弘揚於中國此後南方此後復於中國此後北方更至北方之北焉於南方後復弘傳於中國者約為此王之時有謂北方以後再弘傳於中國此亦經中之言也云云此未如實讀經之過也四茶苦羅祐陀王時代之諸阿闍黎同此王時西印度有茶苦羅祐陀王者約與西藏恥松得贊王同一時代此王之時大因明者善護師子賢美嚴海雲光生滿增大金剛阿闍黎佛智足及其心愛之諸弟子乃至佛密佛寂罽賓國之阿闍黎蓮華生音因明家法源授持律者師子面等人皆出世五師子賢之講說般若彼眾之中師子賢者王族出家諸宗之義皆廣了知從阿闍黎靜命聽講諸中觀論及教授等於堪布徧照賢處聽講般若經現觀莊嚴論及教授為達磨波羅王所迎請往黎迦覩迦三熱伽藍中為數千聽眾說般若法註八千般若等書之論甚多於達磨波羅王即位二十餘年後入滅六海雲阿闍黎海雲者親見無能勝王被授記命作瑜伽師地論釋以菩薩地釋最著稱云七佛智足與五祕密部大阿闍黎佛智足者為師子賢弟子之先進者約於師子賢示寂時獲得成就始開始說法後此數年為王上師不久更作超岩寺之開光師舉為彼寺之金剛阿闍黎此阿闍黎亦略說作部等上三部瑜伽廣說密集幻化網佛平等相應密月明點忿怒文殊之五部內續部尤於密集精勤誦讀弘揚極廣八寂友此阿闍黎之弟子寂友者為精通對法俱舍般若及作部等上三部瑜伽之班支達阿闍黎智足知其堪能為之灌頂因更自修見夜魔敵於那爛陀南方建阿牟利多伽羅伽藍九羅睺羅跋陀羅王族羅睺羅跋陀羅學習明處而得班支達之位者也然智慧少鈍焉因阿闍黎之灌頂加持成就密集親見五如來成就祕密主於閻浮提洲廣作利益有情事至土羅彌羅國南印度地方於彼多說祕密真言續部今尚住世也十佛密與佛寂阿闍黎佛密與佛寂者皆佛智足之前期弟子也即從前阿闍黎及多數持金剛乘者總則多聞密咒別則通達作修瑜伽三續部於瑜伽續部更獲成就佛密登雪山國之底塞爾雪峯修行後於波羅奈斯說法有年西藏恥松得贊派貝馬拉希等往迎請未能來佛寂雖亦云住底塞爾山實乃去之烏仗那國也阿闍黎迦馬拉西拉亦顯為此王時之出世者不可以為係彼前出世者也第三十一章摩蘇羅俱什多王婆那波羅王摩西波羅王時代一法勝法友等人此後達磨波羅王之婿摩蘇羅俱什達統治王國約八年此後達磨波羅王之婆那波羅王統治王國約十年二王之時阿闍黎因明家法勝法友無垢友法藏等人出世此二王者極信佛教但於佛事無新興辦故不計入波羅七代焉二中觀應成派之後馬鳴與諸餘阿闍黎此後婆那波羅王之子磨西波羅王出統治王國五十二年粗略計之約當此王崩逝時西藏王恥惹亦於同時出世於此王時阿闍黎眾喜藏與勝義世俗二諦修菩提心次第一書之作者馬鳴為中觀應成派之人與阿闍黎利他月蓮等人出阿闍黎智授與智稱亦顯然為此時代出世者於罽賓國持律者勝友一切智天施戒等人出此三人曾來西藏成就者禘盧黎波亦此時出世彼之歷史於餘處詳三眾喜藏阿闍黎眾喜藏之生地為摩揭陀族係貴族屬大眾部為唯識中道派於超岩寺習五明處聞藩伽羅國國王之成就者般羅迦舍旃陀羅即極明月者彼之諸弟子說瑜伽諸續部乃去彼國會遇善現護等多數阿闍黎通達一切瑜伽續部阿闍黎賢護聞之自中國來請問法要為之灌頂說真實攝還而講述於中國焉摩西波羅王聞之問曰汝從誰人聞此法耶曰國人其或未之知也藩伽羅國有阿闍黎眾喜藏者從彼聞之王生大信使迎彼至居之近於摩揭陀南方熾燃洞窟之歐搽耶奈頂寶殿中聽密咒者為數極多乃造釋真實攝大疏顯實等論復為摩西波羅王從父兄弟之歐提毘舍國毘羅搽盧耶王所召請至昔日門闍王生地之一伽藍造吉祥上樂第一大疏此外更作密集等續部無上註釋此時有阿闍黎跋瞿者從金剛甘露續部而獲成就阿闍黎甘露密為成就之大瑜伽者彼諸人者出世年代為何王時未能確知若以下事比度推計為提婆波羅王以後出世者則甚明也彼之弟子即阿闍黎跋瞿亦成就起尸悉地以此為依更多成就上妙寶瓶滿足四方一切眾生於富羅耶伽城附近建立五佛如來之大神殿於南方羯盧那吒建立金剛甘露之大神殿復為班支達無垢賢毘摩羅跋陀羅等講說續部因此諸阿闍黎之恩賜於摩揭陀續部極為興盛云第三十二章摩訶波羅王與沙牟波羅王時代一時輪之出世彼子為摩訶波羅王在位四十一年於歐丹多富黎伽藍以聲聞僧眾為主而供養之並供養比丘五百說法者五十建彼伽藍之支寺名字流婆沙伽藍於超岩寺作為供養之中心伽藍於那爛陀亦設立道場於摩西波羅王之晚年毘照阿闍黎迎請時輪續部於此王時弘揚之因明家莊嚴堪布即慧生密者出瑜伽者蓮華鈎摩訶祇多黎黑三昧耶金剛阿闍黎塔伽那等輩出毘照阿闍黎之傳記於餘處詳彼之弟子時輪足亦於此王時出世此王崩後彼婿沙牟波羅王統治王國歷年十二二藏足及其弟子祇多梨此中阿闍黎者以前於婆那波羅王守護王國時東方婆連陀羅有小王薩那多那者彼有一妃形容端麗智慧具足彼王向婆羅門族之阿闍黎藏足請求密集金剛灌頂以王妃為供養物一時彼為藏足生一相貌端好之子其後於摩西波羅王供奉一名部栗俱舍富黎之上妙道場亦供養超岩寺班支達之波得羅多說法要聲譽大起造集學論入行論與虛空藏經等書攝釋三黑三昧耶金剛黑三昧耶金剛是佛智足法傳承中之法嗣也住於羅羅國閒靜處親見喜金剛曼荼羅得無量之能力第三十三章紮那迦王時代一紮那迦王與土耳其王之戰爭此後摩那波羅王之長子悉隸瑟吒波羅受命即位三年而崩無何事業傳後故不計入七代焉摩訶波羅王之末年或即於是時粗略計之與西藏佛教後弘期之開始當為同時代也此時婆羅門智足出世亦為小黑行之後半期云最小之子年僅十七歲於此中頃彼之叔父紮那迦王即位彼在位時迎請阿闍黎顯底波等六賢門之名稱於是時出王在位二十九年與土耳其王戰而勝之一次藩伽羅國人叛亂入侵摩揭陀超岩寺之朵馬阿闍黎作不動佛之大朵馬投之恆河藩伽羅境內之多數土耳其船為之擊沉王復勝戰夷之為附庸王國於是始獲平安嗣後彼侄即摩訶波羅王之最小子吠耶波羅受命即位居於藩伽羅東方大海與恆河交流處如一小洲之跋締五年崩逝二超岩寺六賢門之顯底波慧生意語自在稱與那露波於此際出世之六賢門中東門守護者之阿闍黎羅覩那迦羅顯底波南門之守護者慧生意般羅惹諾迦羅摩禘善巧通達一切明處親見文殊西門守護者阿闍黎語自在稱婆盧守婆羅盧禘生於波羅奈斯剎帝利族從大眾部出家堪布命彼之名為尸羅稀底為那爛陀與超岩寺西門之守護者彼建說般若波羅蜜多之道場八說密集之道場四說上樂喜金剛四座摩耶之道場各四更多建立中觀辯論單獨道場之講堂長時講說中論般若莊嚴經論密集喜金剛夜魔敵入楞伽經等如是於超岩寺多年之間利益有情晚年至尼泊爾專致力於悉地成就亦復講說密乘少許據西藏歷史所載南門守護者為語自在稱西門守護者為慧生本史則採自印度記載相同之三種史書者北門守護者那露波具爭時期之一切智者顯底波亦曾聽法於此阿闍黎三覺賢於此處彼之後繼者以上座覺賢為之此人受生於歐提毘舍貴族之家圓滿具足菩薩行種姓覺醒於明集入行尤於菩薩地最為通達四摩揭陀之二大柱摩揭陀之第一大柱婆羅門寶金剛者以優婆塞之身三十歲間善自修學了達全部經咒明處後來摩揭陀王與以超岩寺之波得羅於彼處主要者講說密集無數法門及七部量論慈氏五法等於多年中攝益眾生此後再至罽賓與多數外道辯而摧破之使入佛教更建立講說中論莊嚴經論密集等之精舍各一晚年去之西方烏仗那國於罽賓國有通達外道宗義之婆羅門到烏仗那晤寶金剛而與之辯寶金剛勝令彼改入佛教名之曰瞿孚耶般若來西藏之阿闍黎紅即其人也罽賓人謂婆羅門寶金剛即於烏仗那住處化為虹身而去云寶金剛之子摩訶闍那彼之子薩闍那於西藏正法傳承亦有莫大之恩惠摩揭陀國之第二大柱者慧吉祥友為破二邊論之作者具吉祥阿提沙幼年最有大恩之上師也彼生於瞿陀善巧通達龍樹無著一切論義多通達密咒續部於經及續見聞最廣淨香殿火由阿闍黎為之修復更復修葺頹敗道場而建新道場於摩揭陀及藩伽羅亦多所修建此六賢門於吠耶波羅王守護王國之前期尚住世此搽那迦王曾於佛教作大事業但非波羅族系故未計入波羅七代自此以後於罽賓國因明極盛因明學者日密亦出世第三十四章吠耶波羅王與湼耶波羅王時代一阿提沙梅多梨波此後吠耶波羅王守護王國約三十二年僅保護前之教法未斷而已未見作顯著之佛事故彼亦未被計入波羅七代此王之時適值六賢門入滅之後阿提沙尊者被迎請為堪布亦兼護理歐丹多富梨寺此後不久是總主梅多梨波事業興盛之時梅多梨波自吉祥回來之時顯底波之六賢門已逝去多年矣吠耶波羅王之子為湼耶波羅王阿提沙尊者入藏之時彼王始即位諸可信之傳記如是云更有一尼泊爾迎請尊者之書信此王即位三十五年彼即位九年之後總主梅多梨波入滅二大金剛座不空金剛等人此王供養名大金剛座者此人優婆塞時之名為功德吉祥出家之名為功德黑密又不空金剛於東方具神通者毘流耶跋陀羅提婆阿迦羅栴陀羅智護復次那露波之及門弟子尚多數在世那露波之親炙弟子吉祥最勝者頓毘波與勘達波之傳記於餘處詳迦索利波者成就金剛瑜伽母梨梨波修習智慧力極小之人也吉祥那露巴為之指示依上樂輪生圓次第少許教授修觀而得悉地於任一法皆獲生起無礙智慧三智護智護者大班支達比丘承事那露波凡十二年多聞父續母續之法尤精通母親特別精通者則上樂輪也四無比海阿闍黎無比海亦於此時出世彼為精通一切明處與時輪金剛之班支達也修聖觀音得大手印悉地五因明家夜魔梨此時善巧因明之夜魔梨亦出世彼主要者精通聲明因明亦通餘一切明處六造七部量論釋之商羯羅難陀即於此時於罽賓國有商羯羅難陀者出彼精通一切宗義及因明造七部論釋第三十五章阿摩羅波羅王訶薩底波羅王與俱扇底波羅王時代一羅多那迦羅崛多等人湼耶波羅王之子為阿摩羅波羅王彼守護王國凡十二年彼時乃阿闍黎羅多那迦羅崛多為金剛座堪布之時也阿摩羅波羅王死時子訶薩底波羅尚幼小恐其不克執行政事由四大漢如法啟迪幼子守護王國者凡八年此後訶薩底波羅王即位享國約及十五年彼同母弟俱扇底波羅王嗣立在位約十四年此二王時代為羅多那迦羅崛多住於叟摩利山之時此二王之時代前所說於湼耶波羅王時代之彼眾阿闍黎亦各住世亦為栴多梨波與阿提沙之弟子大卑吒波達磨迦羅摩底地藏中觀師子友密等心愛弟子五人及其他惹諾那室利密多羅等說法之班支達三十七人利益眾生之時亦顯然是摩那迦室利及罽賓國之菩提跋陀羅覺賢尼泊爾之盤天波兄弟智金剛印度人在手等人利益眾生之時二羅睺羅友等人稱為羅睺羅友之密集布繪曼荼羅儀軌作者與尼泊爾那露波弟子印度陀利迦波之盧伊波灌頂儀軌作者亦出世彼二人有以為即聖天之及門弟子羅睺羅密多羅與大成就者陀利迦波二人者此本尚懷疑乃作希望為彼之斷定至堪怪異也此中尤著者為薩咥羅波羅即大班支達三十萬堅護於超岩寺廣說般若波羅蜜多此外班支達及成就者其數甚多而一向具大聲譽者則未之多見也此二王時於聖教事株守前規希有之事未之多作故不計入七代之中焉第三十六章羅摩波羅王時代一大阿闍黎阿跋耶迦羅崛多訶薩底波羅王之子為羅摩波羅王雖沖齡踐祚心智極利權力亦大即位不久大阿闍黎阿跋耶迦羅崛多被迎請為金剛座之堪布此後多年復被請為超岩寺與那爛陀之堪布此際與前規制不同於超岩寺有班支達約百六十人有座位比丘千人每作供養時可有出家者五千人來集於金剛座有為王所供養之大乘者四十人聲聞比丘二百人皆常住焉集會之時可有聲聞比丘萬人來集於歐丹多富梨寺亦常住比丘千人大小乘比丘二部俱有集會之時可有出家者一萬二千人來集云諸全數大乘者之頂寶則阿闍黎阿跋耶迦羅也諸聲聞等亦曾之為大持律者而禮拜之此阿闍黎之傳記於餘處詳尤於教法宏揚最力後此彼自所著書極為弘傳不為謗者之所動搖阿闍黎書迄今尚光耀於印度諸大乘者之前此後出世之阿闍黎羅多那迦羅扇底與此阿闍黎兩人除利眾生及大小乘外與以先阿闍黎世親等人功德相同云二回教之傳播此復在昔達磨波羅王崩逝以後於藩伽羅王國恆河北岸無諍城與耶無那河兩岸之諸國與從波羅奈斯至摩羅婆中間之富羅耶伽末土羅俱盧盤搽羅多阿伽羅薩伽哩制哩等處崇信外道尤其崇信回教者日益增多於羯摩流底羅孚底與歐提毘舍外道亦所在多有於摩揭陀則佛教徒眾較前興盛僧伽及瑜伽行者亦特別增多大阿闍黎阿跋耶迦羅以智悲力能自在圓滿亦被稱為圓滿持教之阿闍黎具大聲譽之殿軍一切諸方咸如是呼之云彼為利益未來眾生於佛佛子之諸密意設為問答造作眾多最勝之論較六賢門後出世之諸阿闍黎之著述為殊勝故應敬禮也多數釋論亦及身著成羅摩波羅王在位約四十年於阿闍黎阿跋耶迦羅入滅後尚享國歷若干年三佛稱之來西藏其後此王未崩之前子夜苦叉波羅王即位越三年羅摩波羅王崩此後夜苦叉波羅王在位一年王國為大臣羅波斯那所僭奪彼等諸王治世之時阿闍黎守跋迦羅崛多住於超岩寺雜彌佛彌住於金剛座據一般舊史氏言彼入藏時阿跋耶迦羅尚住世也雖如是云但最初謁見阿闍黎阿跋耶迦羅未曾長時依止則甚顯然而被巡行西藏之時為羅婆斯那王尚在世之時也夜苦叉斯那王原文疑誤似應作夜苦叉波羅王以後波羅族之王族未得國者尚多繁衍今猶存焉然得國者未之有也此波羅族之一切王族為日種云旃陀羅與斯那兩族其根本則為一族即月種也第三十七章斯那四王等時代一阿跋耶迦與釋迦室利等大自在者二十四人羅婆斯那王之子迦薩斯那王彼子摩尼多斯那王彼子羅抵迦斯那王出彼諸人者統治王國歷幾何年則不確知但四王總計將近八十年而不能超過之也彼等時代由守跋迦羅崛多羅毘室利惹諾那那夜迦波室利陀舍婆羅室利與較彼等少後之法生寂吉祥稱天尼守迦蘭迦提婆達磨迦羅崛多等皆阿跋耶迦羅信徒之智者成就者諸無量人持守佛教於羅抵迦斯那王時代罽賓國之大班支達釋迦吉祥賢尼泊爾之佛吉祥大阿闍黎羅多那羅俱什多大善巧者惹諾那迦羅崛多大善巧者佛吉祥友大善巧者僧伽摩惹諾那羅毘室利跋陀羅旃陀羅迦羅崛多等諸勤律儀者持金剛者到經海彼岸者多出世焉稱為摩漢達大自在者二十四人云此中大班支達釋迦室利之歷史尤著聲譽罽賓國之佛陀室利亦曾短時作超岩寺大眾部之上座更於尼泊爾國多說般若與密咒等二羅多那羅俱什多與摩揭陀之滅亡大阿闍黎羅多那羅俱什多於般若乘與諸明處其所了達等釋迦室利因明則釋迦室利善巧密咒則彼善巧加持與能力則同等云屬大眾部作超岩寺真言阿闍黎親見上樂時輪夜魔敵等無量本尊於摩揭陀之滅亡二年前即為授記篤信彼之眾多弟子自其時起皆去罽賓及尼泊爾摩揭陀滅亡之時去之北方於尼泊爾廣利眾生亦曾入藏但居留之時間則甚短暫三惹諾那迦羅崛多諸人惹諾那迦羅崛多者曾親見慈氏菩薩佛陀室利密多羅者夢中親聞金剛亥母說法更通達一切明處親見本尊具足一切圓滿次第殊勝功德金剛吉祥婆日羅室利者為十力者陀舍婆羅之弟子爾時享年殆及百歲此後住世亦近百年於南方使堪能者數千人成就密乘而得解脫四佛教衰微與回教徒之入侵斯那四王時代摩揭陀國中外道亦漸次興盛奉大食國之回教者亦日益增多王於歐丹多富梨寺與超岩寺亦各減小其城雉以兵駐守之於金剛座未建立大乘部略有瑜伽行者與大乘者說法焉於守夏時聲聞萬人集其他諸道場多數奄然淪於衰息矣於超岩與歐丹多富梨其僧眾數約與阿跋耶迦羅時代相等云羅抵迦王車夫崩逝後羅溫斯那王守護王國多年治平此後於恆河與耶無那河中間之案達羅毘陀國有土耳其王名月者出時有比丘為王使臣而禍以起彼與居藩伽羅等各國之土耳其眾多小王聯合舉兵摩揭陀國大遭蹂躪歐丹多富梨寺出家者被殺極眾此寺與超岩寺俱被焚燬於歐丹多富梨寺之遺址建大食之城堡焉五釋迦室利之入藏與諸班支達之逃亡班支達釋迦室利去之東方歐提毘舍國之闍伽盧陀羅於彼處留住三年轉來西藏大羅多那羅俱什多去之尼泊爾大班支達惹諾那迦羅崛多等大班支達與近百數小班支達去之印度西南方大班支達佛陀室利密多羅與十力者之弟子婆日羅室利更與眾多小班支達俱遠逃南方僧伽摩室利惹諾那羅毘室利跋陀羅旃陀羅迦羅崛多等摩漢達十六人與小班支達約二百人遠去東方之普康牟拈甘普遮於是摩揭陀國教法奄然滅亡矣此際成就者修行者雖多住世然以有情共業所感莫可挽救也於時瞿羅叉之徒眾大部瑜伽者昏庸愚昧為得外道諸王之利養恭敬故轉為大自在天之徒眾並唱言曰我等與土耳其不相違也僅奈得須婆羅之一小地區尚為內道之所居住焉於羅婆斯那與彼子佛陀斯那彼子哈梨達斯那彼子補羅底達斯那等時須奉命於土耳其王權力極小彼等僅略作與己權力相等之內道崇奉而已佛陀斯那王時代大班支達羅睺羅室利跋陀羅住於那爛陀聽法者約七十人此後部孚密室利跋陀羅此後優波耶室利跋陀羅等人出世與彼等同等之羯盧那室利跋陀羅牟尼陀羅室利跋陀羅各隨所應努力奉守釋迦教法富羅底達斯那王崩後彼之世系斷絕有云尚有其他崇信佛教之諸小王出但於正史則未之見也六搽伽拉羅闍王之征服土耳其富羅底達斯那王崩去後約過百年之時於藩伽羅國有權力強大之搽伽拉羅闍王出制哩以內之新都及一切土耳其皆為其所征服彼王最初信婆羅門教以王妃信奉佛教心為之變彼於金剛座作大供養一切神殿被破壞者為之修復大淨香殿之九層樓四層為土耳其破壞善為葺補令班支達舍利弗陀羅居之而建立道場焉於那爛陀諸大神殿亦作大供養只未建立為道場耳此王頗享大年彼逝世已百六十年矣其後於摩揭陀國崇信佛教之王出世者則未之或聞以是勤律儀者持經藏者亦未聞有出世者焉第三十八章超岩寺之堪布傳承一楞伽勝賢現在應述其他單獨散見之事自從在昔吉祥達磨波羅王之時代起至搽那迦王未出世之時代為止中間約經五王時代於超岩寺由真言金剛大阿闍黎以次嬗代守護教法達磨波羅王時代最初為阿闍黎佛智足彼後則為燃燈賢守護教法彼之傳記於餘處詳於摩蘇羅俱什多王之時代楞伽勝賢出世此阿闍黎生楞伽國精通一切聲聞藏之班支達比丘也嗣來摩揭陀精研大乘尤精密法於超岩寺修上樂輪親見本尊作超岩寺之真言阿闍黎二吉祥持此後婆羅門阿闍黎吉祥持室利陀羅出彼之傳記於餘處詳聞彼於南方示現大神變被請至超岩寺此阿闍黎為慧稱之法統繼承者曾作有紅黑夜魔敵諸書西藏人謂彼為阿闍黎黑行之弟子然非彼住人世時之弟子乃以後親見聖容之弟子也三跋婆跋陀羅此後跋婆跋陀羅出彼亦總則通一切法別則嫻習唯識教理及了達續部約五十數於眠夢為上樂輪所加持親見度母大作自他兩利之行四具分稱等人此後具分稱出彼亦為到密海之彼岸者神通無礙云此後黎羅婆日羅出得夜魔敵成就曾退土耳其兵此後難勝月出彼之傳記於餘處詳此後則為黑三昧耶金剛出已於前文述及之矣此後覺賢菩提跋陀羅出通達密咒及內外一切諸法覺賢之名稱甚多此名前西藏人少有稱呼之者此後迦摩拉羅俱什多出此阿闍黎乃一比丘精通一切經咒尤於般若密集夜魔敵等最為善巧此阿闍黎為阿提沙及瓊保瑜伽者等最有大恩之上師也晚年住於近那爛陀之一林邊一心專修以成就圓滿次第為主云以上十二阿闍黎除初二外其餘諸人如其次第每十二年遞為堪布云五阿提沙等人與超岩寺於迦摩拉羅俱什多以後六賢門出此後多數真言阿闍黎出燃燈智阿提沙等共同護教之座主傳承僅未斷絕六賢門後歷若干年皆單獨居住無堪布也此後阿提沙燃燈智出此後由大金剛座短期作堪布此後有名迦摩羅俱梨舍者作堪布此後有名那忍達羅室利惹諾那者作堪布此後阿跋耶迦羅作堪布歷時甚久此後守跋迦羅崛多作此後蘇那夜迦波室利作此後法生寂作此後大班支達釋迦室利作自此而後超岩寺毀滅矣第三十九章東方孤基地區佛教之弘傳一孤基之疆域印度東方可分三部屬於阿波蘭多迦之藩伽羅與歐提毘舍者稱為東方之阿波蘭多迦東北之迦摩盧國笛富羅國訶薩摩國等稱為格哩婆羅哈即山所圍繞之義也從是等處至東方近於北方山邊之楠伽札諸國近於大海之普康泊爾古等之雅康國汗薩婆笛摩盧拘等之牟拈國及其他之搽伽摩甘菩遮等凡此一切總名之曰孤基云二孤基之佛教如是於此孤基之諸國約自阿育王之時候始有大眾部後漸增廣達於極盛世親菩薩未出世前僅有聲聞以後世親少數弟子弘傳大乘於時時間得其少分達磨波羅王而後於中國中彼之弟子極為眾多尤其於四斯那時代集會於摩揭陀之僧眾約有半數為出自孤基者也是故大乘極為弘通如於西藏王國者然大小二乘乃至無別約於阿跋耶迦羅出世以後真言乘亦漸發達摩揭陀國為土耳其破壞之時中國多數智者來於此地以故教法最為興盛當此之時有名戌跋闍多王者彼建造神殿甚多建立道場亦及二百所彼後有信訶闍支王出彼增益正法較前為勝於此一切諸國之中教法弘揚至於其極於時時間集多僧眾至今尚有二三萬比丘云而優婆塞亦極眾多也以後至西藏之班支達婆那羅多那等亦皆來自彼方嗣有婆羅孫陀羅王出律與對法及大乘教極為弘揚普及全國然諸密咒法除時輪三華鬘略見而外餘則罕有也彼地乃派班支達約二百數前往土羅美羅島與南方之卡根陀羅國詣大成就者寂密等人之前修密咒法再度興復之彼子旃陀羅婆訶那現在雅康阿底多婆訶那守護搽迦摩波羅婆訶那守護牟拈順陀羅訶恥守護楠伽札以今視昔教法最極興盛矣第四十章於諸小島佛教傳播理趣與南方等地佛教之再度弘傳一諸小島之聲聞教復次於錫蘭島與耶婆島銅島湯羅金地檀那室利島波伊古島之諸小島先時佛教弘傳甚早乃至現在尚興盛焉錫蘭島亦有各種大乘教而大部則聲聞也現今於名室利波土迦地大師足跡之法會中尚有比丘約萬二千為之會集大部皆聲聞也於檀那室利波伊古略有大乘餘諸小島惟有聲聞所化之有情而已二蓮華生阿提沙與土羅美羅島於土羅美羅島自始即無佛教由阿闍黎蓮華生最初為之建立焉阿提沙亦曾至其處自此而後約百年間摩揭陀烏仗那與罽賓等國之持金剛者出世極多密乘廣為傳播前時於達磨波羅王時代埋藏者與在印度已滅亡之續部類及自歐提耶奈所迎請之續部類為印度所無者甚多今則密咒四續部之根本佛教已如前弘揚而律與對法及般若宗義却僅有矣三南方等地佛教之弘傳於南印度之國中摩揭陀為土耳其所破壞後毘土耶奈伽國崑古那摩盧耶羅迦隣伽等國多建立不甚廣大之道場修法之人著大聲譽者亦無多但最勝之說法者與成就者則常出世未之或斷也班支達稱為人中之日者亦為於土梨隣伽境內迦隣伽出世者如是西南諸王國中迦羅那王建立佛教後摩揭陀為土耳其所破壞時惹諾那迦羅崛多等為之弘揚於摩盧梅婆羅恥多婆羅比覩婆訶部索羅守多古資羅他諸國境內多設道場現在僧眾尚甚多也尤其於此後得成就大自在者寂密之加持力於卡根陀羅與瀕陀耶山腹佛教新興焉四婆羅跋陀羅王羅摩旃陀羅王之時於諸僧眾多興供養彼子婆羅跋陀羅王多建神殿並於室利羅多格哩宅達歐闍耶烏羅婆斯等處建立多數精舍更以無量門建立道場於此國中新比丘亦約有二千人云講修顯密經咒二者之真實佛教極為弘揚且增廣矣第四十一章於南方弘法傳承華鬘一書所出之史話一華鬘一書之著者罽賓國與南方孤基等國之君王世系薈萃而筆之於書者則未之見南方國中弘法利生最為圓滿之王國史話攝要製作者則有名為華鬘一書為婆羅門摩諾摩底之所著也其中如是記載云於南方香至國中戌迦拉羅闍白王與旃陀羅輸跋二王之時代大海中小島伽羅荼等地有一能轄多數禽鳥者出為禽鳥建立神殿名為羅劾底羅闥云二統治王等諸王之供養布施事業復次統治王與商羯羅王可意王之時於千佛塔日各以一傘及無量資具供養之復次蒲伽蘇婆羅王即富美髮王彼子月軍彼子商羯羅師子王三王之時於比丘等及優婆塞亦分供以值銀五百巴那之資具彼等生地頗為難知大概出於崑迦那國三毘耶具羅羅闍等諸王之供養事業商羯羅師子王彼有三子長名毘耶具羅羅闍領地為多羅崑迦那建立神殿及二千所中子佛陀領地為波羅崑迦那與覩魯羅底常時供養比丘五千人末子佛陀舒闍棄捨王國最後得為土羅婆梨之王引一萬婆羅門與一萬佛徒不斷說法又於瀕陀耶山腹有六面童子王者出成就財流天女明咒以穀物衣食布施貧民乞者四大海王等諸王之建立道場於摩盧耶羅國大海王威伏王尊勝王首領王等四人一系傳承時各建立五百道場所建神殿亦稱是五提婆羅闍王等諸王之保護教法於迦羅那札國與毘土耶那伽羅國諸處有大自在王出彼子天王彼子種種王三王之時命令國中五族及婆羅門一切等眾除三寶外不信他教在位各三十年彼有子三人長曰嬰兒王在位三年次曰極燒王在位一月彼二王者各建廟極燒王之誡曰有信非佛教之諸餘教者殺無赦末子那伽羅闍薄伽梵與一萬眷屬俱出國浮舟東征卡木附近之敵即於彼處獲得王國崇信佛陀於有關教法之事業盛為興作六波羅密多羅等人之建塔造像婆羅門波羅密多羅者生於迦隣伽國彼於達二海邊中間之地滿建法塔復次南方國土為長三角形尖端南指底邊與中國之地相接尖端之最尖銳處有羅浼濕縛羅國從彼國至東方所有之海名為摩睺陀提從彼國至西方中間所有之海名為羅多那格哩二海相連因為此島三角形所分隔故此海之正南至於遠處大海之色不混雜也波浪相交之近邊有達類瓦以故在摩睺陀提與羅多那格哩相接之中間於每一城建一法塔此於文殊續經授記曰地到兩海終者即謂此也又有婆羅門那伽計覩者造釋尊像十萬軀每像各以最上千種之供養品以為供養又有婆羅門增鬘彼造萬卷書之函於每函亦以十五種供養品而供養之於講說研讀此類書籍之比丘優婆塞約四千人亦長時供養之又大乘阿闍黎伽具伽梨者獲得聞持陀羅尼證得無邊他心通因彼之教授一千弟子得無生忍童喜者乃果彌國之優婆塞也為五千優婆塞說法彼等皆獲通達般若童慧者一在家之優婆塞也因彼說法國中少年男女以上總計萬人於大乘得禪定七眾喜賢等人復次比丘眾喜賢惟說諦言能息城中諸人病患及一切魔優婆塞施賢與楞伽提婆者出繪如來像以萬數所建佛塔亦稱是又優婆塞婆孚部稅者於十五年間以衣食等施諸乞者八大德中觀慧復次優婆塞大德中觀慧出引外道入佛教近萬人焉彼諸阿闍黎疑為龍樹以前出世者餘似決定為於大乘發達後至吉祥法稱以前時代出世者但與以前所舉諸人同時與否尚未見明文也第四十二章略究四部義一上座部人之分部意見以前所說之一切僧伽部亦惟是從四部與十八部分裂而成者彼等之建立得略言其端緒焉前人於諸十八部每部之見與行之解說雖無不同而於分裂理趣則種種不同之意見生諸上座部人之意見最初分為二部上座部大眾部大眾部復分為八部根本大眾部一說部說出世部多聞部說假部制多耶部東山部西山部上座部復分為十部根本上座部說一切有部犢子部法上部賢道部一切所貴部化多部法藏部善降雨部鬱多羅部藏文直譯為無上部二大眾部人之分部意見諸大眾部人之意見最初分為三部上座部大眾部說分別部上座部復分為二部說一切有部犢子部說一切有部復分為二部根本說一切有部說經部犢子部復分為四部一切所貴部法上部賢道部六城部大眾部復分為八部根本大眾部東山部西山部王山部雪山部制多耶部義成部牛住部鷄胤部說分別部復分為四部化地部迦葉部法藏部或譯法護部紅衣部三一切所貴部人之分部意見諸一切所貴人之意見大眾部分為六部根本大眾部一說部牛住部多聞部說常部藏文為說常部似應為說假部制多耶部說一切有部分為七部根本說一切有部說分別部化多部法藏部法護部紅衣部迦葉部說轉部犢子部分為四部根本犢子部法上部賢道部一切所貴部雪山部無分裂最初分裂之根本者為四部大眾部說一切有部犢子部雪山部四說一切有部人之分部意見諸說一切有部人之意見如阿闍黎調伏天於異部宗輪論中所說大眾部分為五部東山部西山部雪山住部說出世部說假部說一切有部分為七部根本說一切有部迦葉部化地部護法部曇無德部多聞部紅衣部之弟子說分別部上座部分為三部祇多林住部無畏山住部大伽藍部一切所貴部分為三部鷄胤部守護部犢子部由地與義及阿闍黎之分別而成十八異部此是從根本四部分裂而成十八部之由來也此復於無量續部中亦言根本四部而四部之計算法未舉犢子部之意見而與上說一致我等應取此主張此乃採自世親阿闍黎之說可為依據也五分部名目之異說於比丘年代考中根本四部與此相同大眾部作六部一切所貴部作五部是等解釋少有不同但應取前之說法除不相同之計算法外名稱不同者亦多有焉多分義則是一名稱則異或亦有計算方法不同者此中迦葉部者從阿羅漢迦葉後之少數弟子另分裂而成者此部亦名善降雨部善歲部如是化地部護法部紅衣部銅鍱部彼之異名皆上座部分出者也說轉部無上部紅衣部為一部制多耶部與東山部亦為一部彼為遍行者大天之弟子也從彼分裂為義成部與王山部據後者之計法此二不入十八部出世山部與鷄胤部為一部一說部有謂為大眾部之總名者憍屢拘羅部亦譯為鷄胤部犢子部法上部賢道部六城部等大體言之其義一也於聖地與諸小洲之一切僧眾四部各持其說而不相混十八部教義典籍雖迄今猶有存者然持彼之教理而不相混者則無多也於波羅王七代之間僅有七部傳承未斷今之諸聲聞亦唯此數而已總之四部為不相混者此外犢子部與憍屢拘羅部是一切所貴部之二部說常部似說假部之誤與說出世部是大眾部之二部根本說一切有部與紅衣部是說一切有部之二部此則可決定者也以後所謂化喻部者是自紅衣部所分出之諸經部也此部不計入十八部中第四十三章真言乘起源略考一真言乘之起源一切經部續部各有緣起續部發生情形較之經部發生情形自不相同然此難縷述但反之則經部與續部二者無有時地大師之不同也是故與大乘諸經同時諸續部亦多半出現於人世多數甚深無上瑜伽續部則分為各成就之阿闍黎所迎請亦如其次第出現人間如由吉祥薩羅訶迎請佛頂續部盧伊波迎請普行瑜伽母盧婆波與蓮華金剛迎請喜金剛俱黎守那搽嚕耶迎請口相應明點羅黎多婆日羅迎請三面黑夜魔敵犍毘羅婆日羅迎請甘露金剛顧顧梨波迎請摩訶摩耶毘覩波迎請時輪金剛是也二真言乘發生之誤說以前有人謂真言乘之發生理趣上樂俱生成就書名中有此誤說也最勝智者布頓大師之言曰此僅為上樂俱生成就之史實而非全部密咒之發生理趣其言信矣若能於真言乘彼之續部傳承可靠史實多事披閱則真言乘發生理趣當知之矣余曾攝要作寶生論可參看也總之聖地所出一切成就者之史實誰能全數表而出之僅以度母真言續部而論得成就者於龍樹時即有五千由陀梨迦波與黑行之眷屬等人歷史推測之應知人數之眾為不可思議也第四十四章造像發生理趣一佛滅百年迄龍樹時代以前之工巧明在昔人之工匠具不善巧所作工藝最為希有繪像逼真於毘奈耶經等中曾明言之釋尊滅後百年之間如彼等者亦多有焉此後漸少多有天工現作人身建造大菩提與文殊師利鼓音等之摩揭陀國八希有佛殿阿育王時八大聖地之法塔與金剛座之內院則為夜叉工匠所建造者二龍樹後之工巧明及其流派龍樹時代龍之工匠所造者亦多有如是天龍夜叉所造者造後多年依然逼真此後時代日下如是者無有矣雖有良工亦無人知此後長時諸巧思者所造之不同工藝傳甚多然建立一派擁有徒眾者則未之見也此後佛方王時代有一良工名溫婆薩羅者浮雕畫繪最為希有可與前之天工媲美彼之徒眾乃至無量此人生於摩揭陀國以故奉彼為宗之工巧人等無論生於何方皆稱為中國工匠云膩沙流迦尸羅王時代生於摩盧國之蘇利伽陀哩乃極善巧之工匠也彼之浮雕畫繪可等諸夜叉於奉彼派者稱為西方古派云於提婆波羅王與具吉祥護法時代於婆連陀羅國有一極善巧之工匠名提摩者彼有子名毘覩波盧父子二人所作之塑像浮雕繪畫可與龍之工匠比美二人傳授各彼子居於藩伽羅國彼二人之徒眾無論生於何國於諸塑像者皆稱東方之神於畫繪者彼父徒眾稱為東派彼子徒眾以盛於摩揭陀國稱為中國畫派又尼泊爾古時工藝宗派與西方古派相似中頃之畫繪範銅大致與東方相同亦表現尼泊爾本派之特色後期則無確切之表現矣於罽賓國以前為中國派與西方古派之流衍以後有一名訶須羅闍者開創繪畫與浮雕二者之新宗派今稱之為罽賓派焉以上所說諸種遺規今無多存現在於普康及南方之地造像尚盛彼等之宗派西藏以前未之見也於南方稱為闍耶波羅闍耶毘闍耶者即勝者勝他更勝之三派其徒眾亦甚多也結論明示吉祥源流正法寶於聖地云何弘通理趣名滿所願求之此書者一因人勸二因利他於焉製作結康巴達喇那他自齡三十四歲戊申之木星年造於上岩之法宮願佛教寶於一切方興盛廣布長時住世四聖生處佛母之般若聖者國中正法生起理聖者智者教授清淨論由聖者智現見此著作欲解脫者皆堪聽聞此似地中寶前所未發見文殊上師為開智慧之門如願法施妙雨新流布願一切吉祥
